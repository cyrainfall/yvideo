<template id="frame-03-template" data-composition-id="frame-03" data-width="1920" data-height="1080" data-duration="10.171">
  <style>

    @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-800.woff2') format('woff2');font-weight:800;font-display:block}

    @font-face{font-family:'IBM Plex Mono';src:url('../../assets/fonts/IBMPlexMono-500.woff2') format('woff2');font-weight:500;font-display:block}

    #frame-03-root {
      --f03-ground: #111111;
      --f03-cream: #F0ECE5;
      --f03-muted: #888880;
      --f03-hint: #505048;
      --f03-line: #282826;
      --f03-orange: #E85D26;
      --f03-band: 184px; /* caption keep-out: bottom 17% */

      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--f03-ground);
      color: var(--f03-cream);
      font-family: "Barlow", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    #frame-03-root * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── L0 · ground plane + 1px ruler grid (static, behind the camera) ── */
    #f03-ground { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    #f03-ground .f03-plane { position: absolute; inset: 0; background: var(--f03-ground); }
    #f03-grid {
      position: absolute;
      left: 0; right: 0; top: 0;
      bottom: var(--f03-band);
      background-image:
        repeating-linear-gradient(to right, var(--f03-line) 0, var(--f03-line) 1px, transparent 1px, transparent 48px),
        repeating-linear-gradient(to bottom, var(--f03-line) 0, var(--f03-line) 1px, transparent 1px, transparent 48px);
      opacity: 0;
    }

    /* ── L1 · the stage the camera pushes over ── */
    #f03-cam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    #f03-cam-in {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    #f03-divider {
      position: absolute;
      left: 1152px; top: 268px;
      width: 1px; height: 282px;
      background: var(--f03-line);
      transform-origin: 50% 0;
    }

    .f03-panel { position: absolute; top: 0; height: 100%; }
    .f03-panel--l { left: 0; width: 1152px; }
    .f03-panel--r { left: 1152px; width: 768px; }

    .f03-label {
      position: absolute;
      top: 268px;
      width: 300px;
      font-family: "IBM Plex Mono", system-ui, monospace;

    .f03-valbox {
      position: absolute;
      top: 318px;

      align-items: flex-end;

    }
    .f03-valbox--l { left: 105px; }
    .f03-valbox--r { left: 64px; }

    .f03-val {
      display: block;
      font-family: "Barlow", system-ui, sans-serif;
      font-weight: 900;
      font-size: 172px;
      line-height: 0.86;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: var(--f03-cream);
    }
    /* fixed digit column so the unit never shifts while the counter rolls */
    .f03-val--fixed { width: 220px; transform-origin: 0% 100%; }
    .f03-val--o { color: var(--f03-orange); }

    .f03-unit {
      margin-left: 20px;
      margin-bottom: 22px;
      font-family: "IBM Plex Mono", system-ui, monospace;
      font-size: 28px;

      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--f03-muted);
      white-space: nowrap;
    }

    .f03-rail {
      position: absolute;
      top: 528px;
      height: 22px;
      border-top: 1px solid var(--f03-line);
      border-bottom: 1px solid var(--f03-line);
      background: rgba(240, 236, 229, 0.05); /* the bare track reads as an instrument, not a gap */
      overflow: visible;
      opacity: 0;
    }
    .f03-rail--l { left: 105px; width: 960px; --f03-cell: 16px; }
    .f03-rail--r { left: 64px; width: 600px; --f03-cell: 10px; }

    .f03-rail-art { position: absolute; inset: 0; transform-origin: 50% 50%; }

    .f03-fill {
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      z-index: 1;
    }
    .f03-fill--l { background: var(--f03-muted); }
    .f03-fill--o { background: var(--f03-orange); }

    .f03-cells {
      position: absolute;
      inset: 0;
      z-index: 3;
      background-image: repeating-linear-gradient(
        to right,
        var(--f03-line) 0,
        var(--f03-line) 1px,
        transparent 1px,
        transparent var(--f03-cell)
      );
    }

    .f03-head {
      position: absolute;
      top: 0; left: 0;
      width: 6px; height: 100%;
      margin-left: -3px;
      z-index: 5;
    }
    .f03-head--l { background: var(--f03-cream); }
    .f03-head--o { background: var(--f03-orange); }

    .f03-tick {
      position: absolute;
      top: -9px;

      z-index: 2;
      opacity: 0;
    }

    .f03-rule {
      position: absolute;
      left: 64px; top: 486px;
      width: 384px; height: 2px;
      background: var(--f03-orange);
      transform-origin: left center;
      z-index: 6;
    }

    /* ── L2 · static HUD, outside the camera ── */
    .f03-hud { position: absolute; inset: 0; pointer-events: none; }
    .f03-hud-num {
      position: absolute;
      top: 118px; left: 105px;
      font-family: "IBM Plex Mono", system-ui, monospace;
      font-size: 28px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.14em;
      color: var(--f03-muted);
      opacity: 0;
    }
    .f03-tag {
      position: absolute;
      right: 105px;
      bottom: 212px;
      font-family: "IBM Plex Mono", system-ui, monospace;
      font-size: 28px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      color: var(--f03-muted);
      white-space: nowrap;
      opacity: 0;
    }
    .f03-tag .f03-tag-sep { color: var(--f03-muted); }
  </style>

  <div id="frame-03-root" data-composition-id="frame-03" data-duration="9.171" data-width="1920" data-height="1080" data-layout-allow-overflow="true">

    <!-- L0 — full-bleed ground, its own clip layer -->
    <div id="f03-ground" class="clip" data-start="0" data-duration="10.171" data-track-index="0">
      <div class="f03-plane"></div>

    <div id="f03-cam" data-layout-allow-overflow="true">

          <div id="f03-labelL" class="f03-label f03-label--l"><span class="f03-slash">/</span>编码器指令</div>

          <div id="f03-railL" class="f03-rail f03-rail--l">

              <div id="f03-fillL" class="f03-fill f03-fill--l"></div>

            <div id="f03-headL" class="f03-head f03-head--l"></div>

        <section class="f03-panel f03-panel--r">
          <div id="f03-labelR" class="f03-label f03-label--r"><span class="f03-slash f03-slash--o">/</span>桌面真实更新</div>
          <div id="f03-valBoxR" class="f03-valbox f03-valbox--r">
            <span id="f03-heroVal" class="f03-val f03-val--o">8–11</span>
            <span class="f03-unit">次/秒</span>
          </div>
          <div id="f03-rule" class="f03-rule"></div>
          <div id="f03-railR" class="f03-rail f03-rail--r">
            <div class="f03-rail-art">
              <div id="f03-fillR" class="f03-fill f03-fill--o"></div>
              <div class="f03-cells"></div>
            </div>

            <i id="f03-tick-2" class="f03-tick" style="left: 20px"></i>
            <i id="f03-tick-3" class="f03-tick" style="left: 30px"></i>
            <i id="f03-tick-4" class="f03-tick" style="left: 40px"></i>
            <i id="f03-tick-5" class="f03-tick" style="left: 50px"></i>
            <i id="f03-tick-6" class="f03-tick" style="left: 60px"></i>
            <i id="f03-tick-7" class="f03-tick" style="left: 70px"></i>
            <i id="f03-tick-8" class="f03-tick" style="left: 80px"></i>
            <i id="f03-tick-9" class="f03-tick" style="left: 90px"></i>
            <i id="f03-tick-10" class="f03-tick" style="left: 100px"></i>

    <!-- L2 — static HUD -->
    <div class="f03-hud">
      <div id="f03-num" class="f03-hud-num">03</div>
      <div id="f03-tag" class="f03-tag">60 fps <span class="f03-tag-sep">·</span> 编码帧率 <span class="f03-tag-sep">/</span> bitblt ≈115ms</div>
    </div>

  </div>

  <script>
    (function () {
      "use strict";

      var COMP = "frame-03";
      var W = 1920;
      var H = 1080;
      var CELLS = 60;
      var LEFT_PX = 960;
      var RIGHT_PX = 600;
      var STEP_TIMES = [3.18, 3.62, 3.98, 4.44, 4.92, 5.26, 5.81, 6.22, 6.63, 7.02, 7.3];

      function build() {
        var root = document.getElementById("frame-03-root");
        var hero = document.getElementById("f03-heroVal");
        var leftVal = document.getElementById("f03-leftVal");
        if (!root || !hero || !leftVal || !window.gsap) return;

        /* camera target: the real laid-out centre of 8–11, measured once at setup */
        var rr = root.getBoundingClientRect();
        var s = rr.width > 0 ? rr.width / W : 1;
        var hr = hero.getBoundingClientRect();
        var heroCx = (hr.left + hr.width / 2 - rr.left) / s;
        var heroCy = (hr.top + hr.height / 2 - rr.top) / s;
        if (!isFinite(heroCx) || !isFinite(heroCy) || hr.width < 1) {
          heroCx = 1405;
          heroCy = 392;
        }
        var offX = heroCx - W / 2;
        var offY = heroCy - H / 2;

        /* headroom budget: the hero stays inside 88% of the canvas at peak */
        var hw = Math.max(hr.width / s, 1);
        var hh = Math.max(hr.height / s, 1);
        var maxScale = Math.min((0.88 * W) / hw, (0.88 * H) / hh);
        var ZOOM = Math.min(2.0, maxScale);

        var tl = gsap.timeline({ paused: true });

        /* ── Scene 1 · 0.0–1.2 · the split stands up, grid + two labels, no numbers ── */
        tl.fromTo("#f03-grid", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.04);
        tl.fromTo("#f03-divider", { scaleY: 0 }, { scaleY: 1, duration: 0.62, ease: "power3.out" }, 0.14);
        tl.fromTo("#f03-labelL", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
        tl.fromTo("#f03-labelR", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.42);
        tl.fromTo("#f03-num", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.22);
        tl.fromTo("#f03-tag", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.34);

        /* ── Scene 2 · 1.2–3.1 · the encoder pacer runs flat out to 60 and locks ── */
        tl.set("#f03-fillL", { scaleX: 0 }, 0);
        tl.to("#f03-railL", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.52);
        tl.to("#f03-valBoxL", { opacity: 1, duration: 0.24, ease: "power2.out" }, 1.22);
        tl.fromTo("#f03-leftVal", { scale: 0.78 }, { scale: 1, duration: 1.78, ease: "none" }, 1.22);
        tl.fromTo("#f03-fillL", { scaleX: 0 }, { scaleX: 1, duration: 1.78, ease: "none" }, 1.22);
        tl.fromTo("#f03-headL", { x: 0 }, { x: LEFT_PX, duration: 1.78, ease: "none" }, 1.22);

        var roll = { v: 0 };
        tl.to(
          roll,
          {
            v: 60,
            duration: 1.78,
            ease: "none",
            onUpdate: function () {
              leftVal.textContent = String(Math.round(roll.v));
            },
          },
          1.22
        );

        tl.fromTo("#f03-headL", { scaleY: 1 }, { scaleY: 2.2, duration: 0.09, ease: "power2.out" }, 3.0);
        tl.to("#f03-headL", { scaleY: 1, duration: 0.28, ease: "power2.inOut" }, 3.09);

        /* ── Scene 3 · 3.1–7.4 · the desktop band steps, one cell per beat, never closes ── */
        tl.set("#f03-fillR", { scaleX: 0 }, 0);
        tl.set("#f03-headR", { x: 0 }, 0);
        tl.to("#f03-railR", { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.64);
        tl.fromTo(
          "#f03-valBoxR",
          { opacity: 0, y: 14, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
          3.12
        );

        STEP_TIMES.forEach(function (t, i) {
          var n = i + 1;
          tl.to("#f03-fillR", { scaleX: n / CELLS, duration: 0.1, ease: "power2.out" }, t);
          tl.to("#f03-headR", { x: n * (RIGHT_PX / CELLS), duration: 0.1, ease: "power2.out" }, t);
          tl.fromTo("#f03-headR", { scaleY: 2.1 }, { scaleY: 1, duration: 0.24, ease: "power3.out" }, t);
          var tick = document.getElementById("f03-tick-" + n);
          if (tick) {
            tl.to(tick, { opacity: 0.9, duration: 0.05, ease: "none" }, t);
            tl.to(tick, { opacity: 0.2, duration: 0.5, ease: "power2.out" }, t + 0.05);
          }
        });

        /* ── Scene 4 · 7.4–9.171 · camera pushes in; 8–11 becomes the largest type, then stills ── */
        tl.to("#f03-cam", { scale: ZOOM, duration: 1.6, ease: "power3.inOut" }, 7.4);
        tl.to("#f03-cam-in", { x: -offX, y: -offY, duration: 1.6, ease: "power3.inOut" }, 7.4);
        tl.to(".f03-rail-art", { scaleY: 0.34, opacity: 0.22, duration: 1.6, ease: "power3.inOut" }, 7.4);
        tl.to("#f03-divider", { opacity: 0, duration: 0.8, ease: "power2.out" }, 7.4);
        tl.to("#f03-valBoxL", { opacity: 0, duration: 0.7, ease: "power2.in" }, 7.4);
        tl.to(".f03-label", { opacity: 0.26, duration: 1.1, ease: "power2.out" }, 7.45);
        tl.to(".f03-head", { opacity: 0.14, duration: 0.9, ease: "power2.out" }, 7.55);
        tl.fromTo("#f03-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.66, ease: "power2.out" }, 7.58);
        tl.to(".f03-tick", { opacity: 0.1, duration: 0.9, ease: "power2.out" }, 7.95);

        window.__timelines[COMP] = tl;
        if (typeof window.__hfForceTimelineRebind === "function") window.__hfForceTimelineRebind();
      }

      if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === "function") {
        document.fonts.ready.then(build);
      } else {
        build();
      }
    })();
  </script>
</template>
