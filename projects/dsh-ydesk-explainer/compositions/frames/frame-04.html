<!doctype html>
<!--
  frame 04 — mux

  Four stock container mouths (mp4 / matroska / mpegts / nut) are each shown a
  12.5 fps read-out, then crossed by a blocking rule and dropped to cream-muted.
  A self-built fMP4 track slides in from off-frame right and moof / mdat
  fragments are welded onto it, one at a time, until the chain meets the frame's
  right edge and stops.

  Shape: sub-composition. Everything the runtime needs — styles, markup, script —
  lives inside the template element; the file's head is transport metadata only.
  Broadside dark register: ink-black ground, cream type, one fire-orange accent,
  1px hairlines, IBM Plex Mono chrome. GSAP comes from the host (window.gsap);
  no external library is loaded here.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame 04 — mux</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-400.woff2') format('woff2');font-weight:400;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-800.woff2') format('woff2');font-weight:800;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-900.woff2') format('woff2');font-weight:900;font-display:block}
        @font-face{font-family:'IBM Plex Mono';src:url('../../assets/fonts/IBMPlexMono-500.woff2') format('woff2');font-weight:500;font-display:block}

        /* ---- root ---------------------------------------------------------- */
        #frame-04,
        #frame-04 * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        #frame-04 {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          container-type: size;
          background: #111111;
          color: #f0ece5;
          /* the shipped mono first, then a real system mono (if the woff2 above cannot
             render, the column widths stay monospaced), then the generic stack — CJK
             has no woff2 and lands on the renderer's system CJK face via sans-serif. */
          font-family: 'IBM Plex Mono', 'SF Mono', Menlo, ui-monospace, monospace, sans-serif;
          font-weight: 500;
          font-variant-numeric: tabular-nums;
          -webkit-font-smoothing: antialiased;

          --ink: #111111;
          --cream: #f0ece5;
          --muted: #888880;
          --hint: #505048;
          --orange: #e85d26;
          --line: #282826;
          --line-lit: #33332f;
          --line-dead: #1e1e1c;
          --weld: rgba(232, 93, 38, 0.14);
          --weld-soft: rgba(232, 93, 38, 0.5);
        }

        /* ---- layer 1 · ground (its own clip layer) ------------------------- */
        #f04-bg {
          position: absolute;
          inset: 0;
          background: #111111;
        }

        /* ---- layer 2 · hairline grid --------------------------------------- */
        #f04-grid {
          position: absolute;
          inset: 0;
          background-image:
            repeating-linear-gradient(
              to right,
              rgba(240, 236, 229, 0.05) 0 1px,
              rgba(240, 236, 229, 0) 1px 96px
            ),
            repeating-linear-gradient(
              to bottom,
              rgba(240, 236, 229, 0.05) 0 1px,
              rgba(240, 236, 229, 0) 1px 96px
            );
        }

        /* ---- layer 3 · chrome ---------------------------------------------- */
        #f04-toprule,
        #f04-bottomrule {
          position: absolute;
          left: 96px;
          width: 1728px;
          height: 1px;
          background: var(--line);
          transform-origin: 0 50%;
        }
        #f04-toprule {
          top: 72px;
        }
        #f04-bottomrule {
          top: 806px;
        }

        .f04-slate {
          position: absolute;
          top: 44px;
          font-size: 0.68cqw;
          line-height: 1;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--hint);
        }
        #f04-slate-l {
          left: 96px;
        }
        #f04-slate-r {
          right: 96px;
          text-align: right;
        }

        #f04-step {
          position: absolute;
          left: 96px;
          top: 822px;
          font-size: 0.76cqw;
          line-height: 1;
          letter-spacing: 0.14em;
          color: var(--muted);
        }

        /* ---- layer 4 · four container mouths ------------------------------- */
        #f04-ports {
          position: absolute;
          left: 96px;
          top: 142px;
          width: 760px;
          height: 594px;
        }

        .port {
          position: absolute;
          left: 0;
          width: 760px;
          height: 132px;
        }

        .p-idx {
          position: absolute;
          left: 0;
          top: 0;
          width: 44px;
          height: 132px;
          display: flex;
          align-items: center;
          font-size: 0.64cqw;
          line-height: 1;
          letter-spacing: 0.14em;
          color: var(--hint);
        }

        .p-box {
          position: absolute;
          left: 54px;
          top: 0;
          width: 650px;
          height: 132px;
          border: 1px solid var(--line-lit);
        }

        .p-name {
          z-index: 2;
          position: absolute;
          left: 26px;
          top: 0;
          height: 130px;
          display: flex;
          align-items: center;
          font-size: 1.06cqw;
          line-height: 1;
          letter-spacing: 0.05em;
          color: var(--cream);
        }

        .p-fps {
          z-index: 2;
          position: absolute;
          right: 86px;
          top: 0;
          height: 130px;
          display: flex;
          align-items: center;
          font-size: 0.92cqw;
          line-height: 1;
          letter-spacing: 0.06em;
          color: var(--orange);
        }

        /* the mouth: a socket collar punched through the box's right edge */
        .p-mouth {
          position: absolute;
          left: 594px;
          top: 43px;
          width: 112px;
          height: 44px;
          color: var(--line-lit);
          border: 1px solid currentColor;
          background: var(--ink);
        }
        /* currentColor so the collar and its two fins die together */
        .p-mouth::before,
        .p-mouth::after {
          content: '';
          position: absolute;
          left: 12px;
          right: 12px;
          height: 1px;
          background: currentColor;
          opacity: 0.85;
        }
        .p-mouth::before {
          top: 12px;
        }
        .p-mouth::after {
          bottom: 12px;
        }

        /* the blocking rule: grows left→right through the mouth */
        .p-bar {
          position: absolute;
          z-index: 1;
          left: 26px;
          top: 64px;
          width: 674px;
          height: 2px;
          background: var(--orange);
          transform-origin: 0 50%;
        }

        /* ---- layer 5 · the track that runs --------------------------------- */
        #f04-track {
          position: absolute;
          left: 900px;
          top: 0;
          width: 924px;
          height: 1080px;
        }

        .t-kicker {
          position: absolute;
          left: 0;
          top: 306px;
          font-size: 0.62cqw;
          line-height: 1;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: var(--hint);
        }

        #f04-title {
          position: absolute;
          left: -2px;
          top: 322px;
          font-size: 2.6cqw;
          line-height: 1;
          letter-spacing: 0.01em;
          color: var(--cream);
        }

        #f04-trule {
          position: absolute;
          left: 0;
          top: 392px;
          width: 36px;
          height: 2px;
          background: var(--orange);
          transform-origin: 0 50%;
        }

        #f04-rail {
          position: absolute;
          left: 0;
          top: 550px;
          width: 924px;
          height: 2px;
          background: var(--orange);
        }

        #f04-note {
          position: absolute;
          left: 0;
          top: 576px;
          font-size: 0.62cqw;
          line-height: 1;
          letter-spacing: 0.16em;
          color: var(--hint);
        }

        /* fragments: welded onto the rail, alternating strike */
        .frag {
          position: absolute;
          top: 462px;
          height: 88px;
          transform-origin: 50% 100%;
        }
        .frag.moof {
          background: var(--weld);
          border: 1px solid var(--orange);
        }
        .frag.mdat {
          background: transparent;
          border: 1px solid var(--weld-soft);
        }
        .frag::before {
          content: '';
          position: absolute;
          left: -1px;
          top: -8px;
          width: 2px;
          height: 14px;
          background: var(--orange);
          opacity: 0.85;
        }
        .f-lab {
          position: absolute;
          left: 14px;
          bottom: 12px;
          font-size: 0.86cqw;
          line-height: 1;
          letter-spacing: 0.1em;
          color: var(--cream);
        }
        .frag.mdat .f-lab {
          color: var(--muted);
        }
      </style>

      <div
        id="frame-04"
        data-composition-id="frame-04"
        data-duration="8.246"
        data-width="1920"
        data-height="1080"
      >
        <!-- 1 · ground -->
        <div id="f04-bg" class="clip" data-start="0" data-duration="8.246" data-track-index="0"></div>

        <!-- 2 · hairline grid -->
        <div id="f04-grid"></div>

        <!-- 3 · chrome -->
        <div id="f04-toprule"></div>
        <div id="f04-bottomrule"></div>
        <div id="f04-slate-l" class="f04-slate">containers</div>
        <div id="f04-slate-r" class="f04-slate">04</div>
        <div id="f04-step">step 02 · muxer</div>

        <!-- 4 · four mouths that do not carry the frame -->
        <div id="f04-ports">
          <div class="port" id="f04-port-1" style="top: 0">
            <div class="p-idx">01</div>
            <div class="p-box" id="f04-box-1">
              <div class="p-name" id="f04-name-1">mp4</div>
              <div class="p-fps" id="f04-fps-1">12.5 fps</div>
              <div class="p-mouth"></div>
              <div class="p-bar" id="f04-bar-1"></div>
            </div>
          </div>

          <div class="port" id="f04-port-2" style="top: 154px">
            <div class="p-idx">02</div>
            <div class="p-box" id="f04-box-2">
              <div class="p-name" id="f04-name-2">matroska</div>
              <div class="p-fps" id="f04-fps-2">12.5 fps</div>
              <div class="p-mouth"></div>
              <div class="p-bar" id="f04-bar-2"></div>
            </div>
          </div>

          <div class="port" id="f04-port-3" style="top: 308px">
            <div class="p-idx">03</div>
            <div class="p-box" id="f04-box-3">
              <div class="p-name" id="f04-name-3">mpegts</div>
              <div class="p-fps" id="f04-fps-3">12.5 fps</div>
              <div class="p-mouth"></div>
              <div class="p-bar" id="f04-bar-3"></div>
            </div>
          </div>

          <div class="port" id="f04-port-4" style="top: 462px">
            <div class="p-idx">04</div>
            <div class="p-box" id="f04-box-4">
              <div class="p-name" id="f04-name-4">nut</div>
              <div class="p-fps" id="f04-fps-4">12.5 fps</div>
              <div class="p-mouth"></div>
              <div class="p-bar" id="f04-bar-4"></div>
            </div>
          </div>
        </div>

        <!-- 5 · the track: own fMP4, fragments welded on -->
        <div id="f04-track">
          <div class="t-kicker" id="f04-kicker" data-layout-ignore>own container</div>
          <div id="f04-title">fmp4</div>
          <div id="f04-trule"></div>

          <div id="f04-rail"></div>

          <div class="frag moof" id="f04-frag-1" style="left: 0; width: 150px">
            <span class="f-lab">moof</span>
          </div>
          <div class="frag mdat" id="f04-frag-2" style="left: 158px; width: 128px">
            <span class="f-lab">mdat</span>
          </div>
          <div class="frag moof" id="f04-frag-3" style="left: 294px; width: 166px">
            <span class="f-lab">moof</span>
          </div>
          <div class="frag mdat" id="f04-frag-4" style="left: 468px; width: 132px">
            <span class="f-lab">mdat</span>
          </div>
          <div class="frag moof" id="f04-frag-5" style="left: 608px; width: 158px">
            <span class="f-lab">moof</span>
          </div>
          <div class="frag mdat" id="f04-frag-6" style="left: 774px; width: 150px">
            <span class="f-lab">mdat</span>
          </div>

          <div id="f04-note">moof / mdat</div>
        </div>
      </div>

      <script>
        (function () {
          // One paused, seekable timeline for the whole frame.
          var tl = gsap.timeline({ paused: true });

          // Timing skeleton — the four thuds are evenly spaced inside 1.42–4.0s.
          var BLOCK_AT = 1.42;
          var BLOCK_STEP = 0.645;
          var FRAG_AT = 5.46;
          var FRAG_STEP = 0.205;

          /* ---- 0.0–1.4 — hairline grid, chrome, four empty mouths ---------- */
          tl.fromTo(
            '#f04-grid',
            { opacity: 0 },
            { opacity: 1, duration: 0.9, ease: 'power2.out', immediateRender: true },
            0.06,
          );
          tl.fromTo(
            '#f04-toprule',
            { scaleX: 0 },
            { scaleX: 1, duration: 0.7, ease: 'power3.inOut', immediateRender: true },
            0.1,
          );

          Array.prototype.forEach.call(
            document.querySelectorAll('#frame-04 .f04-slate, #f04-step, #f04-bottomrule'),
            function (el, i) {
              tl.fromTo(
                el,
                { opacity: 0, y: -6 },
                { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', immediateRender: true },
                0.16 + i * 0.05,
              );
            },
          );

          Array.prototype.forEach.call(document.querySelectorAll('#frame-04 .port'), function (row, i) {
            tl.fromTo(
              row,
              { opacity: 0, x: -22 },
              { opacity: 1, x: 0, duration: 0.55, ease: 'power3.out', immediateRender: true },
              0.3 + i * 0.085,
            );
          });

          /* ---- 1.4–4.0 — four blocks: read-out, rule, death ---------------- */
          for (var i = 1; i <= 4; i++) {
            (function (n) {
              var at = BLOCK_AT + (n - 1) * BLOCK_STEP;
              var row = document.getElementById('f04-port-' + n);
              var box = document.getElementById('f04-box-' + n);
              var name = document.getElementById('f04-name-' + n);
              var fps = document.getElementById('f04-fps-' + n);
              var bar = document.getElementById('f04-bar-' + n);
              var mouth = row.querySelector('.p-mouth');

              // the read-out lights orange
              tl.fromTo(
                fps,
                { opacity: 0, y: 7 },
                { opacity: 1, y: 0, duration: 0.16, ease: 'power2.out', immediateRender: true },
                at,
              );
              // the blocking rule whips across the mouth
              tl.fromTo(
                bar,
                { scaleX: 0, backgroundColor: '#E85D26' },
                { scaleX: 1, duration: 0.22, ease: 'power4.out', immediateRender: true },
                at + 0.09,
              );
              // the hit: a 1px orange edge, then everything drops to the mute ramp
              tl.to(box, { borderColor: '#E85D26', duration: 0.05, ease: 'none' }, at + 0.29);
              tl.to(box, { borderColor: '#1E1E1C', duration: 0.22, ease: 'power2.out' }, at + 0.35);
              tl.to(bar, { backgroundColor: '#505048', duration: 0.2, ease: 'power2.out' }, at + 0.3);
              tl.to(fps, { color: '#888880', duration: 0.18, ease: 'power2.out' }, at + 0.3);
              tl.to(name, { color: '#505048', duration: 0.2, ease: 'power2.out' }, at + 0.3);
              tl.to(mouth, { color: '#1E1E1C', duration: 0.2, ease: 'power2.out' }, at + 0.3);
              // the thud itself — a 2.5px settle, not a bounce
              tl.to(row, { y: 2.5, duration: 0.07, ease: 'power2.out' }, at + 0.29);
              tl.to(row, { y: 0, duration: 0.22, ease: 'power2.out' }, at + 0.36);
            })(i);
          }

          /* ---- 4.0–5.4 — the track slides in from off-frame right ---------- */
          tl.fromTo(
            '#f04-track',
            { x: 320 },
            { x: 0, duration: 0.78, ease: 'power4.out', immediateRender: true },
            4.02,
          );
          tl.fromTo(
            '#f04-track',
            { opacity: 0 },
            { opacity: 1, duration: 0.12, ease: 'none', immediateRender: true },
            4.02,
          );
          tl.fromTo(
            '#f04-kicker',
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', immediateRender: true },
            4.34,
          );
          tl.fromTo(
            '#f04-title',
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', immediateRender: true },
            4.4,
          );
          tl.fromTo(
            '#f04-trule',
            { scaleX: 0 },
            { scaleX: 1, duration: 0.22, ease: 'power4.out', immediateRender: true },
            4.54,
          );
          tl.fromTo(
            '#f04-note',
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: 'power2.out', immediateRender: true },
            4.66,
          );

          /* ---- 5.4–7.246 — fragments welded on, one at a time -------------- */
          for (var f = 1; f <= 6; f++) {
            tl.fromTo(
              document.getElementById('f04-frag-' + f),
              { opacity: 0, y: -14, scale: 0.94 },
              { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: 'power4.out', immediateRender: true },
              FRAG_AT + (f - 1) * FRAG_STEP,
            );
          }

          // the last fragment keeps the frame alive — barely
          tl.fromTo(
            '#f04-frag-6',
            { rotation: 0, y: 0 },
            {
              rotation: 0.5,
              y: -1.2,
              duration: 0.15,
              repeat: 1,
              yoyo: true,
              ease: 'sine.inOut',
              immediateRender: true,
            },
            6.86,
          );

          window.__timelines['frame-04'] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
