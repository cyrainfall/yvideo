<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-01 · 光标停在屏幕边缘</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-400.woff2') format('woff2');font-weight:400;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-800.woff2') format('woff2');font-weight:800;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-900.woff2') format('woff2');font-weight:900;font-display:block}
        @font-face{font-family:'IBM Plex Mono';src:url('../../assets/fonts/IBMPlexMono-500.woff2') format('woff2');font-weight:500;font-display:block}

        /* ── frame root: the container every cqw resolves against ───────────────── */
        #frame-01-root {
          --ink-black: #111111;
          --fire-orange: #e85d26;
          --cream: #f0ece5;
          --cream-muted: #888880;
          --cream-hint: #505048;
          --border-dark: #282826;
          --font-display: "Barlow", sans-serif;
          --font-mono: "IBM Plex Mono", monospace;
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
          overflow: hidden;
          container-type: size;
          background: transparent;
        }

        #frame-01-root * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* ── own full-bleed ground (never rely on the root background) ──────────── */
        #frame-01-clip {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: var(--ink-black);
          overflow: hidden;
        }

        .plane {
          position: absolute;
          inset: 0;
        }

        /* ── background: the right-lower thirds cross, drawn out of the crossing ── */
        .guide {
          position: absolute;
          background: var(--border-dark);
          will-change: transform;
        }
        .guide-v {
          left: 66.666%;
          top: 43.5%;
          width: 1px;
          height: 38.5%;
          transform-origin: 50% 60.2%;
        }
        .guide-h {
          top: 66.666%;
          left: 46%;
          width: 42%;
          height: 1px;
          transform-origin: 49.2% 50%;
        }

        /* ── focal: the one coloured object on the plane ────────────────────────── */
        .cursor {
          position: absolute;
          left: 66.666%;
          top: 66.666%;
          width: 2.4cqw;
          height: 3.43cqw;
          will-change: transform;
        }
        .cursor svg {
          display: block;
          width: 100%;
          height: 100%;
        }

        /* ── supporting: mono coordinate readout, left-bottom, clear of captions ── */
        .coords {
          position: absolute;
          left: 5.5cqw;
          top: 74%;
        }
        .coord {
          display: flex;
          align-items: baseline;
          gap: 0.85cqw;
          line-height: 1.45;
        }
        .k {
          font-family: var(--font-mono);
          font-size: 0.7cqw;
          font-weight: 500;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--cream-hint);
        }
        .v {
          font-family: var(--font-mono);
          font-size: 1.15cqw;
          font-weight: 500;
          letter-spacing: 0.08em;
          font-variant-numeric: tabular-nums;
          color: var(--cream-muted);
          min-width: 4ch;
        }

        /* ── two-line title: cream display, per-word landings ───────────────────── */
        .line {
          position: absolute;
          left: 5.5cqw;
          white-space: nowrap;
          color: var(--cream);
          font-family: var(--font-display);
          font-weight: 700;
        }
        .line-1 {
          top: 36.8%;
          font-size: 5.4cqw;
          line-height: 1.06;
          letter-spacing: -0.035em;
        }
        .line-2 {
          top: 56.6%;
          font-size: 3.3cqw;
          line-height: 1.35;
          letter-spacing: -0.02em;
        }
        .w {
          display: inline-block;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .w-hero {
          font-weight: 900;
          font-size: 1.08em;
        }
      </style>

      <div
        id="frame-01-root"
        data-composition-id="frame-01"
        data-duration="3.69"
        data-width="1920"
        data-height="1080"
      >
        <div
          id="frame-01-clip"
          class="clip"
          data-start="0"
          data-duration="3.69"
          data-track-index="0"
        >
          <div class="plane">
            <div class="guide guide-v" aria-hidden="true"></div>
            <div class="guide guide-h" aria-hidden="true"></div>

            <div class="line line-1"><span class="w">先</span><span class="w">看</span><span class="w">这只</span><span class="w w-hero">光标</span></div>

            <div class="line line-2"><span class="w">它</span><span class="w">马上</span><span class="w">就要</span><span class="w">到</span><span class="w">另一台</span><span class="w">电脑</span><span class="w">上去</span><span class="w">了</span></div>

            <div class="coords" id="frame-01-coords" data-layout-ignore>
              <div class="coord"><span class="k">X</span><span class="v coord-x">0000</span></div>
              <div class="coord"><span class="k">Y</span><span class="v coord-y">0000</span></div>
            </div>

            <div class="cursor" id="frame-01-cursor" aria-hidden="true">
              <svg viewBox="0 0 21 30" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path
                  d="M0 0 L0 28 L7.2 20.8 L11.2 29.6 L15.2 28 L11.2 19.2 L20.4 19.2 Z"
                  fill="#E85D26"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("frame-01-root");
          if (!root) return;

          var tl = gsap.timeline({ paused: true });
          var q = function (sel) {
            return root.querySelector(sel);
          };

          /* ── Scene 1 · 0.00–0.60s ─────────────────────────────────────────────
             empty plane. the cursor is already in place (never slides in).
             the right-lower thirds cross draws outward from the crossing point,
             and the coordinate readout counts 0 → (1492, 611) and locks.      */

          tl.fromTo(
            q(".guide-v"),
            { scaleY: 0 },
            { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "50% 60.2%" },
            0
          );
          tl.fromTo(
            q(".guide-h"),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.42, ease: "power2.out", transformOrigin: "49.2% 50%" },
            0.1
          );

          var pos = { x: 0, y: 0 };
          var xVal = q(".coord-x");
          var yVal = q(".coord-y");
          var pad4 = function (n) {
            return String(Math.round(n)).padStart(4, "0");
          };

          tl.to(
            pos,
            {
              x: 1492,
              y: 611,
              duration: 0.6,
              ease: "power2.out",
              onUpdate: function () {
                xVal.textContent = pad4(pos.x);
                yVal.textContent = pad4(pos.y);
              },
            },
            0
          );

          // the short mechanical click: the pointer settles on the crossing
          tl.fromTo(
            q(".cursor svg"),
            { scale: 1.09, transformOrigin: "0% 0%" },
            { scale: 1, duration: 0.26, ease: "power3.out", immediateRender: false },
            0.46
          );

          // breathing-level jitter while the shot is alive, pinned still by 3.29s
          var cursor = q(".cursor");
          var jit = { p: 0 };
          var CYCLES = 5;
          var SPAN = 3.29;
          tl.to(
            jit,
            {
              p: Math.PI * 2 * CYCLES,
              duration: SPAN,
              ease: "none",
              onUpdate: function () {
                var t = (jit.p / (Math.PI * 2 * CYCLES)) * SPAN;
                var env = t < 2.86 ? 1 : Math.max(0, 1 - (t - 2.86) / 0.43);
                gsap.set(cursor, {
                  x: Math.sin(jit.p) * 1.5 * env,
                  y: Math.cos(jit.p * 1.37) * 1.1 * env,
                });
              },
            },
            0
          );
          tl.set(cursor, { x: 0, y: 0 }, SPAN);

          function land(selector, times, dur, rise) {
            var els = root.querySelectorAll(selector);
            for (var i = 0; i < els.length && i < times.length; i++) {
              tl.fromTo(
                els[i],
                { opacity: 0, y: rise, scale: 0.94 },
                { opacity: 1, y: 0, scale: 1, duration: dur, ease: "power3.out" },
                times[i]
              );
            }
          }

          /* ── Scene 2 · 0.60–1.30s ─────────────────────────────────────────────
             「先看这只光标」lands word by word — the hero word 光标 presses down
             first (max weight), the rest of the line fills in behind it.       */
          land(".line-1 .w", [0.72, 0.79, 0.86, 0.6], 0.38, 16);

          /* ── Scene 3 · 1.30–3.20s ─────────────────────────────────────────────
             「它马上就要到另一台电脑上去了」lands as line two in the lower half,
             word by word, then everything holds dead still.                    */
          land(
            ".line-2 .w",
            [1.34, 1.52, 1.68, 1.86, 2.04, 2.26, 2.5, 2.76],
            0.38,
            12
          );

          // register only after the build is complete
          window.__timelines["frame-01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
