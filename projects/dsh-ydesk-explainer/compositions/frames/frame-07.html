<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-07 · 注入：坐标回到桌面</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-400.woff2') format('woff2');font-weight:400;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-800.woff2') format('woff2');font-weight:800;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-900.woff2') format('woff2');font-weight:900;font-display:block}
        @font-face{font-family:'IBM Plex Mono';src:url('../../assets/fonts/IBMPlexMono-500.woff2') format('woff2');font-weight:500;font-display:block}

        /* ── frame root: the container every cqw resolves against ───────────────── */
        #frame-07-root {
          --ink-black: #111111;
          --ink-black-alt: #1a1a18;
          --fire-orange: #e85d26;
          --cream: #f0ece5;
          --cream-muted: #888880;
          --cream-hint: #505048;
          --border-dark: #282826;
          --font-mono: "IBM Plex Mono", monospace;
          --font-body: "Barlow", sans-serif;
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
          overflow: hidden;
          container-type: size;
          background: transparent;
        }

        #frame-07-root * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* ── own full-bleed ground: an independent clip layer, nothing in it ────── */
        #frame-07-clip {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: var(--ink-black);
        }

        /* ── background: the coordinate plane the point is normalized against ───── */
        #frame-07-grid {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background-image:
            linear-gradient(to right, rgba(240, 236, 229, 0.13) 0 1px, transparent 1px),
            linear-gradient(to bottom, rgba(240, 236, 229, 0.13) 0 1px, transparent 1px),
            linear-gradient(to right, rgba(240, 236, 229, 0.06) 0 1px, transparent 1px),
            linear-gradient(to bottom, rgba(240, 236, 229, 0.06) 0 1px, transparent 1px);
          background-size: 640px 640px, 640px 640px, 160px 160px, 160px 160px;
          background-position: 10px 10px;
        }

        /* ── chrome: the session line, above the caption band, on the grid plane ── */
        #frame-07-corner {
          position: absolute;
          left: 5.5cqw;
          bottom: 11.5cqw;
          font-family: var(--font-mono);
          font-weight: 500;
          font-size: 1.08cqw;
          line-height: 1;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          white-space: nowrap;
          color: rgba(240, 236, 229, 0.42);
          pointer-events: none;
        }

        /* ── the sink: every region outside the window falls to pure black ──────── */
        #frame-07-sink {
          position: absolute;
          inset: 0;
          background: #000000;
          opacity: 0;
          pointer-events: none;
        }

        #frame-07-stage {
          position: absolute;
          inset: 0;
        }

        /* ── midground: the one rectangle in the frame. no chrome, no radius ────── */
        #frame-07-win {
          position: absolute;
          left: 470px;
          top: 250px;
          width: 980px;
          height: 560px;
          background: var(--ink-black-alt);
          border: 1px solid rgba(240, 236, 229, 0.34);
          border-radius: 0;
          overflow: hidden;
          will-change: transform, opacity;
        }

        /* the page: three hairline placeholders, twice over, shifted up by one page */
        #frame-07-pages {
          position: absolute;
          inset: 0;
          will-change: transform;
        }

        .row {
          position: absolute;
          left: 64px;
          height: 1px;
          background: rgba(240, 236, 229, 0.28);
          transform-origin: 0 50%;
        }
        #row-a1 { top: 96px;  width: 527px; }
        #row-a2 { top: 244px; width: 748px; }
        #row-a3 { top: 392px; width: 391px; }
        #row-b1 { top: 540px; width: 629px; }
        #row-b2 { top: 688px; width: 442px; }
        #row-b3 { top: 836px; width: 688px; }

        /* ── foreground: the coordinate that becomes the pointer ────────────────── */
        #frame-07-coord {
          position: absolute;
          left: 0;
          top: 0;
          font-family: var(--font-mono);
          font-weight: 500;
          font-size: 2.4cqw;
          line-height: 1;
          letter-spacing: 0.01em;
          white-space: nowrap;
          color: var(--cream);
          will-change: transform, opacity;
        }

        #frame-07-seed {
          position: absolute;
          left: 1166px;
          top: 496px;
          width: 8px;
          height: 8px;
          margin-left: -4px;
          margin-top: -4px;
          border-radius: 50%;
          background: var(--fire-orange);
        }

        .ripple {
          position: absolute;
          left: 1166px;
          top: 496px;
          width: 72px;
          height: 72px;
          margin-left: -36px;
          margin-top: -36px;
          border: 1px solid var(--fire-orange);
          border-radius: 50%;
          opacity: 0;
          pointer-events: none;
        }

        #frame-07-cursor {
          position: absolute;
          left: 1164px;
          top: 494px;
          width: 26px;
          height: 38px;
          transform-origin: 2px 2px;
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }
        #frame-07-cursor svg {
          display: block;
          width: 26px;
          height: 38px;
        }
      </style>

      <div
        id="frame-07-root"
        data-composition-id="frame-07"
        data-duration="9.285"
        data-width="1920"
        data-height="1080"
      >
        <div
          id="frame-07-clip"
          class="clip"
          data-start="0"
          data-duration="8.372"
          data-track-index="0"
        ></div>

        <div id="frame-07-grid" aria-hidden="true"></div>

        <div id="frame-07-corner" data-layout-ignore aria-hidden="true">sendinput · session 0</div>

        <div id="frame-07-sink" aria-hidden="true"></div>

        <div id="frame-07-stage">
          <div id="frame-07-win" data-layout-allow-overflow="true">
            <div id="frame-07-pages">
              <div class="row" id="row-a1" aria-hidden="true"></div>
              <div class="row" id="row-a2" aria-hidden="true"></div>
              <div class="row" id="row-a3" aria-hidden="true"></div>
              <div class="row" id="row-b1" aria-hidden="true"></div>
              <div class="row" id="row-b2" aria-hidden="true"></div>
              <div class="row" id="row-b3" aria-hidden="true"></div>
            </div>
          </div>

          <div id="frame-07-coord" aria-hidden="true">(0.71, 0.44)</div>
          <div id="frame-07-seed" aria-hidden="true"></div>
          <div class="ripple" id="ripple-1" aria-hidden="true"></div>
          <div class="ripple" id="ripple-2" aria-hidden="true"></div>
          <div class="ripple" id="ripple-3" aria-hidden="true"></div>

          <div id="frame-07-cursor" aria-hidden="true">
            <svg viewBox="0 0 26 38" xmlns="http://www.w3.org/2000/svg" focusable="false">
              <path
                d="M2 2 L2 29 L8.4 22.6 L13.2 33.8 L17.6 31.6 L12.8 20.6 L22.2 20.6 Z"
                fill="#E85D26"
                stroke="#111111"
                stroke-width="1"
                stroke-linejoin="miter"
              />
            </svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("frame-07-root");
          if (!root) return;

          var tl = gsap.timeline({ paused: true });
          var q = function (sel) {
            return root.querySelector(sel);
          };

          /* geometry — the point is normalized inside the window's border box:
             470 + 0.71 × 980 ≈ 1166 · 250 + 0.44 × 560 ≈ 496
             the content shifts up by exactly one page (3 rows × 148px pitch)     */
          var PX = 1166;
          var PY = 496;
          var PAGE = 444;

          /* the coordinate's own centre is the anchor, so it lands on the point */
          gsap.set(q("#frame-07-coord"), { xPercent: -50, yPercent: -50 });
          gsap.set(root.querySelectorAll(".ripple"), { scale: 0.34 });

          /* ── Scene 1 · 0.00–1.60s ──────────────────────────────────────────────
             the wireframe window floats out of the plane; its three hairlines draw
             left to right behind it, and the session line is already on the grid. */

          tl.fromTo(
            q("#frame-07-win"),
            { opacity: 0, y: 26, scale: 0.972 },
            { opacity: 1, y: 0, scale: 1, duration: 1.05, ease: "power3.out" },
            0.06
          );

          tl.fromTo(
            q("#frame-07-corner"),
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
            0.34
          );

          tl.fromTo(
            [q("#row-a1"), q("#row-a2"), q("#row-a3")],
            { scaleX: 0 },
            { scaleX: 1, duration: 0.62, ease: "power3.out", stagger: 0.09 },
            0.54
          );

          /* ── Scene 2 · 1.60–3.00s ──────────────────────────────────────────────
             the mono coordinate slides in from the upper left, lands on the point,
             collapses into an orange seed, and the pointer unfurls out of it.    */

          tl.fromTo(
            q("#frame-07-coord"),
            { x: 300, y: 180 },
            { x: PX, y: PY, duration: 0.9, ease: "power3.inOut" },
            1.62
          );
          tl.fromTo(
            q("#frame-07-coord"),
            { opacity: 0 },
            { opacity: 1, duration: 0.28, ease: "power1.out" },
            1.62
          );

          tl.fromTo(
            q("#frame-07-seed"),
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2.4)" },
            2.44
          );
          tl.to(
            q("#frame-07-coord"),
            { scale: 0.3, opacity: 0, duration: 0.28, ease: "power2.in" },
            2.5
          );
          tl.fromTo(
            q("#frame-07-cursor"),
            { opacity: 0, scale: 0.62, x: -6, y: -6 },
            { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.38, ease: "back.out(1.7)" },
            2.62
          );
          tl.to(q("#frame-07-seed"), { opacity: 0, duration: 0.2, ease: "power1.in" }, 2.8);

          /* ── Scene 3 · 3.00–5.00s ──────────────────────────────────────────────
             one press: the pointer compresses on its tip, springs back, three rings
             leave the click point, and the page under it moves up by exactly one. */

          tl.to(q("#frame-07-cursor"), { scale: 0.82, duration: 0.11, ease: "power1.in" }, 3.36);
          tl.to(q("#frame-07-cursor"), { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 3.47);

          ["#ripple-1", "#ripple-2", "#ripple-3"].forEach(function (id, i) {
            var at = 3.44 + i * 0.085;
            tl.to(q(id), { opacity: 0.85, duration: 0.06, ease: "none" }, at);
            tl.to(q(id), { scale: 3.3, duration: 0.62, ease: "power2.out" }, at);
            tl.to(q(id), { opacity: 0, duration: 0.56, ease: "power2.in" }, at + 0.06);
          });

          tl.to(q("#frame-07-pages"), { y: -PAGE, duration: 0.64, ease: "power3.inOut" }, 3.58);

          /* ── Scene 4 · 5.00–7.872s ─────────────────────────────────────────────
             everything outside the window — grid and session line included — sinks
             to pure black; the frame hairline lifts a step so the window and the
             pointer are the only lit things left. no camera, no movement, hold.  */

          tl.to(q("#frame-07-sink"), { opacity: 1, duration: 1.0, ease: "power2.inOut" }, 5.12);
          tl.fromTo(
            q("#frame-07-win"),
            { borderColor: "rgba(240, 236, 229, 0.34)" },
            { borderColor: "rgba(240, 236, 229, 0.62)", duration: 0.9, ease: "power2.out" },
            5.4
          );

          // register only after the build is complete
          window.__timelines["frame-07"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
