<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-08 · 回程：这台机器不在你桌上</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-400.woff2') format('woff2');font-weight:400;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-800.woff2') format('woff2');font-weight:800;font-display:block}
        @font-face{font-family:'Barlow';src:url('../../assets/fonts/Barlow-900.woff2') format('woff2');font-weight:900;font-display:block}
        @font-face{font-family:'IBM Plex Mono';src:url('../../assets/fonts/IBMPlexMono-500.woff2') format('woff2');font-weight:500;font-display:block}

        /* ── frame root: the container every cqw resolves against ───────────────── */
        #frame-08-root {
          --ink-black: #111111;
          --fire-orange: #e85d26;
          --cream: #f0ece5;
          --font-mono: "IBM Plex Mono", monospace;
          --font-zh: sans-serif;
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
          overflow: hidden;
          container-type: size;
          background: transparent;
        }

        #frame-08-root * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* ── own full-bleed ground: an independent clip layer, nothing in it ────── */
        #frame-08-clip {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: var(--ink-black);
        }

        #frame-08-stage {
          position: absolute;
          inset: 0;
        }

        /* ── the lit face: a far room with a screen on in it. A lit wall above,
              a hard-ish horizon, the desk falling away dark below, a lens
              falloff at the corners. Structure first — a surface, not a blob. */
        #frame-08-surface {
          position: absolute;
          inset: 0;
          background-color: #0c0b09;
          background-image:
            /* ceiling: the top of the room has no light in it */
            linear-gradient(
              to bottom,
              rgba(6, 5, 4, 0.66) 0%,
              rgba(6, 5, 4, 0.42) 6%,
              rgba(6, 5, 4, 0.2) 13%,
              rgba(6, 5, 4, 0) 26%
            ),
            /* edge falloff: keeps the four hairline edges readable */
            linear-gradient(
              to right,
              rgba(6, 5, 4, 0.58) 0%,
              rgba(6, 5, 4, 0.14) 7%,
              rgba(6, 5, 4, 0) 21%,
              rgba(6, 5, 4, 0) 79%,
              rgba(6, 5, 4, 0.18) 93%,
              rgba(6, 5, 4, 0.6) 100%
            ),
            /* the desk: a seam at the horizon, the light catch, then it falls away */
            linear-gradient(
              to bottom,
              rgba(7, 6, 5, 0) 56.6%,
              rgba(7, 6, 5, 0.4) 57.3%,
              rgba(7, 6, 5, 0.7) 60.5%,
              rgba(6, 5, 4, 0.85) 70%,
              rgba(5, 4, 3, 0.92) 100%
            ),
            /* the lit core: the far screen's own light, contained inside the band
               so it reads as a subject rather than as a dome */
            radial-gradient(
              38% 26% at 46% 38%,
              rgba(248, 244, 235, 0.88) 0%,
              rgba(244, 238, 226, 0.56) 38%,
              rgba(236, 228, 211, 0.22) 68%,
              rgba(236, 228, 211, 0) 100%
            ),
            /* the wall itself, lit across its middle band: a plane, never a dome */
            linear-gradient(
              to bottom,
              #2b2822 0%,
              #6b6355 8%,
              #b3a892 21%,
              #e4dbc8 35%,
              #f2ead8 44%,
              #dccfb8 52%,
              #b5aa93 60%,
              #7d7563 72%,
              #4a453c 86%,
              #2a2721 100%
            ),
            /* corner falloff */
            radial-gradient(
              152% 122% at 50% 44%,
              rgba(8, 7, 6, 0) 38%,
              rgba(8, 7, 6, 0.28) 78%,
              rgba(8, 7, 6, 0.5) 100%
            );
        }
        /* emitting mesh: a dark weave inside the light, a cream weave in the dark,
           so the plane reads as a screen at every luminance */
        #frame-08-surface .f08-mesh {
          position: absolute;
          inset: 0;
          background-image:
            repeating-linear-gradient(to right, rgba(240, 236, 229, 0.05) 0 1px, transparent 1px 118px),
            repeating-linear-gradient(to bottom, rgba(240, 236, 229, 0.045) 0 1px, transparent 1px 118px),
            repeating-linear-gradient(to right, rgba(17, 17, 17, 0.07) 0 1px, transparent 1px 118px),
            repeating-linear-gradient(to bottom, rgba(17, 17, 17, 0.06) 0 1px, transparent 1px 118px);
        }
        /* emitting mesh: a dark weave inside the light, a cream weave in the dark,
           so the plane reads as a screen at every luminance */
        #frame-08-surface .f08-mesh {
          position: absolute;
          inset: 0;
          background-image:
            repeating-linear-gradient(to right, rgba(240, 236, 229, 0.05) 0 1px, transparent 1px 118px),
            repeating-linear-gradient(to bottom, rgba(240, 236, 229, 0.045) 0 1px, transparent 1px 118px),
            repeating-linear-gradient(to right, rgba(17, 17, 17, 0.07) 0 1px, transparent 1px 118px),
            repeating-linear-gradient(to bottom, rgba(17, 17, 17, 0.06) 0 1px, transparent 1px 118px);
        }
        /* static grain, inlined — no network, no seed, no clock */
        #frame-08-surface .f08-grain {
          position: absolute;
          inset: 0;
          opacity: 0.05;
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
          background-size: 240px 240px;
        }

        /* opening exposure: the room is almost unlit at the start and comes up
           as the light spreads — the point is the only lit thing for a beat */
        #frame-08-open {
          position: absolute;
          inset: 0;
          background: #000000;
          opacity: 0.94;
        }

        /* lower-half dim: gives the type its contrast without killing the face */
        #frame-08-dim {
          position: absolute;
          inset: 0;
          opacity: 0;
          background-image: linear-gradient(
            to bottom,
            rgba(9, 8, 7, 0.32) 0%,
            rgba(9, 8, 7, 0.4) 28%,
            rgba(9, 8, 7, 0.36) 52%,
            rgba(9, 8, 7, 0.14) 78%,
            rgba(9, 8, 7, 0.06) 100%
          );
        }

        /* ── the ignition point: one very small orange dot in dead centre ───────── */
        #frame-08-dot {
          position: absolute;
          left: calc(50% - 6px);
          top: calc(47% - 6px);
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--fire-orange);
          box-shadow: 0 0 12px 1px rgba(232, 93, 38, 0.7);
          opacity: 0;
        }

        /* ── boundary only: four unclosed hairline edges, never a card ──────────── */
        .f08-edge {
          position: absolute;
          background: rgba(240, 236, 229, 0.42);
          opacity: 0;
        }
        #frame-08-edge-top {
          left: 166px;
          top: 96px;
          width: 1588px;
          height: 1px;
        }
        #frame-08-edge-left {
          left: 96px;
          top: 166px;
          width: 1px;
          height: 634px;
        }
        #frame-08-edge-right {
          left: 1823px;
          top: 166px;
          width: 1px;
          height: 634px;
        }
        /* the bottom edge is deliberately split: the tag sits in the gap */
        #frame-08-edge-bl,
        #frame-08-edge-br {
          top: 868px;
          width: 664px;
          height: 1px;
        }
        #frame-08-edge-bl {
          left: 166px;
        }
        #frame-08-edge-br {
          left: 1070px;
          width: 684px;
        }

        /* ── chrome tag: mono, tracked, in the gap on the bottom edge ───────────── */
        #frame-08-tag {
          position: absolute;
          left: 0;
          right: 0;
          top: 852px;
          height: 32px;
          line-height: 32px;
          text-align: center;
          text-indent: 0.34em;
          font-family: var(--font-mono);
          font-weight: 500;
          font-size: 1.46cqw;
          letter-spacing: 0.34em;
          color: rgba(240, 236, 229, 0.72);
          white-space: nowrap;
          opacity: 0;
        }

        /* ── the display layer, pressed onto the lower third ────────────────────── */
        #frame-08-rule {
          position: absolute;
          left: 158px;
          top: 640px;
          width: 36px;
          height: 2px;
          background: var(--fire-orange);
          transform-origin: 0% 50%;
          opacity: 0;
        }
        #frame-08-display {
          position: absolute;
          left: 158px;
          top: 664px;
          transform-origin: 0% 50%;
          font-family: var(--font-zh);
          font-weight: 700;
          font-size: 5.6cqw;
          line-height: 1;
          letter-spacing: -0.01em;
          white-space: nowrap;
          color: var(--cream);
          text-shadow: 0 2px 26px rgba(9, 8, 7, 0.55);
          opacity: 0;
        }
        #frame-08-display .f08-period {
          color: var(--fire-orange);
        }

        /* ── closing line ──────────────────────────────────────────────────────── */
        #frame-08-sum {
          position: absolute;
          left: 158px;
          top: 792px;
          font-family: var(--font-zh);
          font-weight: 400;
          font-size: 1.72cqw;
          line-height: 1.4;
          letter-spacing: 0.02em;
          white-space: nowrap;
          color: rgba(240, 236, 229, 0.74);
          opacity: 0;
        }
      </style>

      <div
        id="frame-08-root"
        data-composition-id="frame-08"
        data-duration="10.8"
        data-width="1920"
        data-height="1080"
      >
        <!-- pure black ground: its own full-bleed clip layer, nothing in it -->
        <div
          id="frame-08-clip"
          class="clip"
          data-start="0"
          data-duration="10.8"
          data-track-index="0"
        ></div>

        <div id="frame-08-stage">
          <div id="frame-08-surface" aria-hidden="true">
            <div class="f08-mesh"></div>
            <div class="f08-grain"></div>
          </div>

          <div id="frame-08-open" aria-hidden="true"></div>
          <div id="frame-08-dim" aria-hidden="true"></div>
          <div id="frame-08-dot" aria-hidden="true"></div>

          <div id="frame-08-edge-top" class="f08-edge" aria-hidden="true"></div>
          <div id="frame-08-edge-left" class="f08-edge" aria-hidden="true"></div>
          <div id="frame-08-edge-right" class="f08-edge" aria-hidden="true"></div>
          <div id="frame-08-edge-bl" class="f08-edge" aria-hidden="true"></div>
          <div id="frame-08-edge-br" class="f08-edge" aria-hidden="true"></div>

          <div id="frame-08-tag" aria-hidden="true">另一台电脑</div>

          <div id="frame-08-rule" aria-hidden="true"></div>
          <div id="frame-08-display">不在你桌上<span class="f08-period">。</span></div>
          <div id="frame-08-sum">六个阶段走完，画面才回来——链路上没有魔法</div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("frame-08-root");
          if (!root) return;

          var q = function (sel) {
            return root.querySelector(sel);
          };
          var surface = q("#frame-08-surface");

          /* ── the radial reveal ────────────────────────────────────────────────
             The mask radius is the animated quantity: a proxy is tweened and the
             gradient is repainted on every update, so any seek is exact and the
             growing edge stays feathered — light spilling out of a screen that is
             coming on, never a hard rim and never a floating blob. */
          var R_MAX = 1450;
          var reveal = { r: 0 };

          function paintReveal() {
            var ry = Math.max(reveal.r, 0.01);
            var rx = ry * 1.3;
            var solid = ry * 0.6;
            var soft = ry * 0.86;
            var g =
              "radial-gradient(ellipse " +
              rx.toFixed(2) +
              "px " +
              ry.toFixed(2) +
              "px at 50% 47%, #000 0px, #000 " +
              solid.toFixed(2) +
              "px, rgba(0,0,0,0.86) " +
              soft.toFixed(2) +
              "px, rgba(0,0,0,0) " +
              ry.toFixed(2) +
              "px)";
            surface.style.webkitMaskImage = g;
            surface.style.maskImage = g;
          }
          paintReveal();

          var tl = gsap.timeline({ paused: true });

          /* ── Scene 1 · 0.00–3.30s ─────────────────────────────────────────────
             纯黑。正中一个极小的橙点起来，随后径向扩开成一整块发光面：扩张是减速
             的（power2.out 4.9s 走完 R_MAX），所以到 3.3s 只是「接近满幅」；
             同时曝光从 0.94 的暗往上抬——面是被点亮的，不是被擦出来的。           */

          tl.fromTo(
            q("#frame-08-dot"),
            { opacity: 0, scale: 0.3 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
            0.16
          );
          tl.to(reveal, { r: R_MAX, duration: 4.9, ease: "power2.out", onUpdate: paintReveal }, 0.66);
          tl.fromTo(
            q("#frame-08-open"),
            { opacity: 0.94 },
            { opacity: 0, duration: 3.1, ease: "power2.in" },
            0.66
          );
          tl.to(q("#frame-08-dot"), { opacity: 0, duration: 0.7, ease: "power1.in" }, 0.85);

          /* ── Scene 2 · 3.30–5.30s ─────────────────────────────────────────────
             扩到接近满幅后停住；四条发丝边按上→下→左右浮出，每条都短一截、四角
             不接（只标边界，不封闭成卡片）；底边被标签从中间断开。               */

          tl.fromTo(
            q("#frame-08-edge-top"),
            { opacity: 0, scaleX: 0.84 },
            { opacity: 1, scaleX: 1, duration: 0.62, ease: "power2.out" },
            3.58
          );
          tl.fromTo(
            [q("#frame-08-edge-bl"), q("#frame-08-edge-br")],
            { opacity: 0, scaleX: 0.84 },
            { opacity: 1, scaleX: 1, duration: 0.62, ease: "power2.out" },
            3.62
          );
          tl.fromTo(
            q("#frame-08-edge-left"),
            { opacity: 0, scaleY: 0.84 },
            { opacity: 1, scaleY: 1, duration: 0.62, ease: "power2.out" },
            3.68
          );
          tl.fromTo(
            q("#frame-08-edge-right"),
            { opacity: 0, scaleY: 0.84 },
            { opacity: 1, scaleY: 1, duration: 0.62, ease: "power2.out" },
            3.76
          );

          tl.fromTo(
            q("#frame-08-tag"),
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
            4.62
          );

          /* ── Scene 3 · 5.30–7.60s ─────────────────────────────────────────────
             亮面轻微压暗（亮带压得重一点，给文字让出对比），显示层从上压到下三分之一：
             「不在你桌上。」——在字幕带之上，句号是这一帧唯一的第二个橙。         */

          tl.fromTo(q("#frame-08-dim"), { opacity: 0 }, { opacity: 1, duration: 1.35, ease: "sine.inOut" }, 5.3);
          tl.fromTo(
            q("#frame-08-rule"),
            { opacity: 0, scaleX: 0 },
            { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" },
            5.3
          );
          tl.fromTo(
            q("#frame-08-display"),
            { opacity: 0, y: -16, scale: 1.035 },
            { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
            5.42
          );

          /* ── Scene 4 · 7.60–10.30s ────────────────────────────────────────────
             总结句收在下方；7.60 + 0.62 = 8.22 之后，全画幅完全静止——到 10.3
             还有两秒多、到宿主槽尾 10.8 还有两秒半，一个像素都不动。              */

          tl.fromTo(
            q("#frame-08-sum"),
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.62, ease: "power2.out" },
            7.6
          );

          // register only after the build is complete
          window.__timelines["frame-08"] = tl;
        })();
      </script>
    </template>
  </body>
