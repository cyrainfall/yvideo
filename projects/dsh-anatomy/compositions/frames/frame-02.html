<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-02 · 一个能力，三个位置</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f2{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#9BA2AD;--faint:#7A8290;
          --accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size;
          background:transparent;font-family:'Inter',sans-serif}
        #f2 *{box-sizing:border-box;margin:0;padding:0}
        #f2 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f2 .plane{position:absolute;inset:0}

        #f2 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f2 .chrome .r{color:var(--muted)}
        #f2 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f2 .h{position:absolute;left:6cqw;top:13.4%;font-weight:800;font-size:3.4cqw;letter-spacing:-.035em;
          color:var(--text);white-space:nowrap}
        #f2 .h em{font-style:normal;color:var(--paper)}
        #f2 .sub{position:absolute;left:6cqw;top:21.4%;font-size:1.5cqw;font-weight:400;color:var(--muted);white-space:nowrap}
        #f2 .sub b{font-weight:400;color:var(--text)}

        /* 三个位置的标签：先说「三个位置」，再逐个填内容 */
        #f2 .role{display:block;font-family:'JB',monospace;font-size:1.5cqw;line-height:1.2;font-weight:500;
          letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
        #f2 .role i{font-style:normal;color:var(--faint);margin-right:.7cqw}

        /* 定义方：在接缝上方 */
        #f2 .def{position:absolute;left:6cqw;right:6cqw;top:25.4%;text-align:center;line-height:1}
        #f2 .def .rl{font-family:'JB',monospace;font-size:1.5cqw;line-height:1.2;font-weight:500;letter-spacing:.16em;
          text-transform:uppercase;color:var(--muted)}
        #f2 .def .rl i{font-style:normal;color:var(--faint);margin-right:.7cqw}
        #f2 .def .nm{margin-top:.85cqw;font-family:'JB',monospace;font-size:1.95cqw;line-height:1.05;color:var(--text);letter-spacing:-.01em}
        #f2 .def .nt{margin-top:.55cqw;font-size:1.5cqw;line-height:1.35;color:var(--muted)}
        #f2 .def .nt b{font-weight:400;color:var(--paper)}

        /* 接缝：一条 1px 竖线，本帧唯一蓝焦点 */
        #f2 .seam{position:absolute;left:50cqw;top:38.6%;width:1px;height:27.4%;background:var(--accent);transform-origin:50% 0}
        #f2 .key{position:absolute;left:51.3cqw;top:40.0%;font-family:'JB',monospace;font-size:1.7cqw;
          letter-spacing:.02em;color:var(--accent)}

        /* 提供方：两个叠格，各自接到接缝，彼此不连 */
        #f2 .pv{position:absolute;left:6cqw;width:30cqw}
        #f2 .pv .nm{font-family:'JB',monospace;font-size:1.8cqw;line-height:1.05;color:var(--text);letter-spacing:-.01em}
        #f2 .pv .nt{margin-top:.45cqw;font-size:1.5cqw;line-height:1.35;color:var(--muted);white-space:nowrap}
        #f2 .pv .nt b{font-weight:400;color:var(--paper)}
        #f2 .p1{top:41.4%}
        #f2 .p2{top:53.8%}
        #f2 .wire{position:absolute;left:30.4cqw;width:19.2cqw;height:1px;background:var(--line2);transform-origin:0 50%}
        #f2 .w1{top:47.8%}
        #f2 .w2{top:55.5%}
        #f2 .notch{position:absolute;left:49.7cqw;width:.4cqw;height:.4cqw;background:var(--line2);opacity:0}
        #f2 .n1{margin-top:0;top:47.58%}
        #f2 .n2{top:55.28%}

        /* 消费方：接在 key 的末端 */
        #f2 .cn{position:absolute;left:58.5cqw;top:60.2%;width:30cqw;line-height:1}
        #f2 .cn .nm{margin-top:.55cqw;font-family:'JB',monospace;font-size:1.8cqw;line-height:1.05;color:var(--text)}
        #f2 .cn .nt{margin-top:.5cqw;font-size:1.5cqw;line-height:1.35;color:var(--muted)}
        #f2 .cn .nt2{margin-top:.6cqw;font-family:'JB',monospace;font-size:1.5cqw;line-height:1.35;color:var(--muted)}
        #f2 .pv .nt2{margin-top:.5cqw;font-family:'JB',monospace;font-size:1.5cqw;line-height:1.35;color:var(--paper);white-space:nowrap}
        #f2 .keyline{position:absolute;left:50.2cqw;top:66.1%;width:7.9cqw;height:1px;background:var(--line2);
          transform-origin:0 50%}
        #f2 .keyhole{position:absolute;left:49.6cqw;top:65.4%;width:.62cqw;height:.62cqw;background:var(--line2);opacity:0}

        #f2 .noimp{position:absolute;left:33.8cqw;top:62.6%;font-family:'JB',monospace;font-size:1.5cqw;
          letter-spacing:.04em;color:var(--muted);white-space:nowrap}
        #f2 .noimp s{text-decoration:none;color:var(--muted);margin-right:.6cqw}

        #f2 .cite{position:absolute;left:6cqw;top:78.0%;font-family:'JB',monospace;font-size:1.5cqw;
          color:var(--faint);white-space:nowrap}
        #f2 .cite b{font-weight:400;color:var(--muted)}

        #f2 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;
          transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f2" data-composition-id="frame-02" data-width="1920" data-height="1080" data-duration="38.463">
        <div id="f2-clip" class="clip" data-start="0" data-duration="38.463" data-track-index="1">
          <div class="ground"></div>
          <div class="prog" id="f2-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.07</span><span class="r">02 — 07</span></div>
            <div class="rule" id="f2-rule"></div>

            <div class="h" id="f2-h">一个能力，<em>三个位置</em></div>
            <div class="sub" id="f2-sub">定义拥有 <b>ctx.shell</b>；两个实现接在线上；消费方只按 key 找它。</div>

            <!-- 01 定义 -->
            <div class="def" id="f2-def">
              <div class="rl" id="f2-dl"><i>01</i>Definition / 定义</div>
              <div class="nm" id="f2-dn">dsh-shell</div>
              <div class="nt" id="f2-ds"><b>ShellExecutor</b> 拥有这个键 · 一个上下文一个名额</div>
            </div>

            <div class="seam" id="f2-seam"></div>
            <div class="key" id="f2-key">ctx.shell</div>

            <!-- 02 提供方 -->
            <div class="pv p1" id="f2-pa">
              <div class="role" id="f2-pal"><i>02</i>Provider / 提供方</div>
              <div class="nm" id="f2-pan">bash-local</div>
              <div class="nt" id="f2-pat">本地执行器 · <b>extends ShellExecutor</b></div>
            </div>
            <div class="wire w1" id="f2-w1"></div>
            <div class="notch n1" id="f2-n1"></div>

            <div class="pv p2" id="f2-pb">
              <div class="nm" id="f2-pbn">bash-sandbox</div>
              <div class="nt" id="f2-pbt">沙箱执行器</div>
              <div class="nt2" id="f2-pbt2">extends LocalBashExecutor</div>
            </div>
            <div class="wire w2" id="f2-w2"></div>
            <div class="notch n2" id="f2-n2"></div>

            <!-- 03 消费方 -->
            <div class="cn" id="f2-cn">
              <div class="role" id="f2-cl"><i>03</i>Consumer / 消费方</div>
              <div class="nm" id="f2-cnn">tool-bash</div>
              <div class="nt" id="f2-cnt">注入 <b style="font-weight:400;color:var(--paper)">ctx.shell</b> · 向模型暴露 bash</div>
              <div class="nt2" id="f2-cnw">tool-pwsh · Windows 上的同一 seam</div>
            </div>
            <div class="keyline" id="f2-kl"></div>
            <div class="keyhole" id="f2-kh"></div>

            <div class="noimp" id="f2-ni"><s>×</s>no import</div>

            <div class="cite" id="f2-cite"><b>packages/shell/shell/src/index.ts:64</b> · <b>packages/shell/tool-bash/src/index.ts:36</b></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f2");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var tl = gsap.timeline({ paused: true });
          var P = "power3.out";
          var fade = function (sel, at, dy, dur) {
            var el = q(sel);
            if (!el) return;
            tl.fromTo(el, { opacity: 0, y: dy || 0 }, { opacity: 1, y: 0, duration: dur || .5, ease: P }, at);
          };
          var to1 = function (sel, at, dur) {
            var el = q(sel);
            if (!el) return tl;
            return tl.to(el, { opacity: 1, duration: dur || .4, ease: P }, at);
          };
          var color = function (sel, at, c) {
            var el = q(sel);
            if (!el) return;
            tl.to(el, { backgroundColor: c, duration: .4, ease: P }, at);
          };

          tl.fromTo(q("#f2-rule"), { scaleX: 0 }, { scaleX: 1, duration: .55, ease: P }, 0);
          tl.fromTo(q("#f2-h"), { y: 14 }, { y: 0, duration: .55, ease: P }, 0);

          // 1.54 它在这个仓库里占三个位置。——三个位置先落位，内容后填
          fade("#f2-sub", 1.54);
          [["#f2-dl", 1.90], ["#f2-pal", 2.06], ["#f2-cl", 2.22]].forEach(function (p) {
            fade(p[0], p[1], 6, .35);
          });

          // 3.775 第一个位置是定义：包叫 D S H shell，它拥有 C T X 点 shell 这个键。
          fade("#f2-dn", 3.90, 8);
          fade("#f2-ds", 4.30);
          tl.fromTo(q("#f2-seam"), { scaleY: 0 }, { scaleY: 1, duration: .62, ease: P }, 4.10);
          tl.fromTo(q("#f2-key"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .45, ease: P }, 4.52);

          // 10.826 第二个位置是提供方：这台机器装的是 Bash 的两个。
          fade("#f2-pan", 10.94, 8);
          fade("#f2-pat", 11.07);
          tl.fromTo(q("#f2-w1"), { scaleX: 0 }, { scaleX: 1, duration: .42, ease: P }, 11.23);
          to1("#f2-n1", 11.39);

          fade("#f2-pbn", 11.51, 8);
          fade("#f2-pbt", 11.63);
          fade("#f2-pbt2", 11.71);
          tl.fromTo(q("#f2-w2"), { scaleX: 0 }, { scaleX: 1, duration: .42, ease: P }, 11.91);
          to1("#f2-n2", 12.07);

          // 18.06 第三个位置是消费方：把 bash 交给模型的工具，还有给 Windows 用的 P W S H。
          fade("#f2-cnn", 18.18, 8);
          fade("#f2-cnt", 18.30);
          tl.fromTo(q("#f2-kl"), { scaleX: 0 }, { scaleX: 1, duration: .5, ease: P }, 18.47);
          to1("#f2-kh", 18.63);
          fade("#f2-cnw", 18.81);

          // 26.10 定义在上，提供方和消费方分在两边，中间不画箭头。
          fade("#f2-ni", 26.10);

          // 32.32 消费方连的是那条线，不是某个人。——线变蓝，提供方那侧仍灰
          color("#f2-kl", 32.32, "#4D6BFE");
          color("#f2-kh", 32.32, "#4D6BFE");
          to1("#f2-kh", 32.28);
          fade("#f2-cite", 32.44);

          // 35.53 三个位置齐了，才算一个能力。
          [["#f2-dl"], ["#f2-pal"], ["#f2-cl"]].forEach(function (p, i) {
            var el = q(p[0]);
            if (el) tl.to(el, { color: "#E9E4D8", duration: .35, ease: P }, 35.53 + i * .09);
          });

          tl.fromTo(q("#f2-prog"), { scaleX: 0 }, { scaleX: 1, duration: 38.463, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
