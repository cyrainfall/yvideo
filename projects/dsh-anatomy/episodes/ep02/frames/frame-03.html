<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-03 · 上下文是容器</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f3{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#7E8590;
          --accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size;background:transparent}
        #f3 *{box-sizing:border-box;margin:0;padding:0}
        #f3 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f3 .plane{position:absolute;inset:0}

        #f3 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f3 .chrome .r{color:var(--muted)}
        #f3 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f3 .h{position:absolute;left:6cqw;top:12.5%;font-family:'Inter',sans-serif;font-weight:800;
          font-size:3.5cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        #f3 .h em{font-style:normal;color:var(--paper)}

        /* ── the three keys ─────────────────────────────────────────────── */
        #f3 .keys{position:absolute;left:6cqw;top:24.5%;width:52cqw}
        #f3 .k{display:flex;align-items:center;height:8.4cqw;border-top:1px solid var(--line)}
        #f3 .k:last-child{border-bottom:1px solid var(--line)}
        #f3 .k .key{width:19cqw;flex:none;font-family:'JB',monospace;font-size:2.05cqw;letter-spacing:-.01em;color:var(--text)}
        #f3 .k .key i{color:var(--faint);font-style:normal}
        #f3 .k .desc{font-family:'Inter',sans-serif;font-size:1.55cqw;line-height:1.45;color:var(--muted);width:22cqw}
        #f3 .k .impl{margin-left:auto;font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.06em;color:var(--faint);text-align:right}

        #f3 .bracket{position:absolute;left:2.1cqw;top:24.5%;height:25.2cqw;width:1px;background:var(--line2);opacity:0}
        #f3 .bracket b{position:absolute;left:-.4cqw;top:-.55cqw;width:.9cqw;height:.9cqw;border:1px solid var(--line2);background:var(--canvas)}
        #f3 .bracket i{position:absolute;left:-.4cqw;bottom:-.55cqw;width:.9cqw;height:.9cqw;border:1px solid var(--line2);background:var(--canvas)}

        /* ── lookup panel ───────────────────────────────────────────────── */
        #f3 .look{position:absolute;left:64cqw;top:24.5%;width:30cqw}
        #f3 .look .k2{font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
        #f3 .look .row{margin-top:1.3cqw;display:flex;align-items:center;gap:.32cqw;
          font-family:'JB',monospace;font-size:1.5cqw;color:var(--text)}
        #f3 .look .row .a{color:var(--accent)}
        #f3 .look .row .r{color:var(--muted)}
        #f3 .look .note{margin-top:1.1cqw;font-family:'Inter',sans-serif;font-size:1.5cqw;line-height:1.5;color:var(--faint)}
        #f3 .look .notimp{margin-top:2.4cqw;font-family:'JB',monospace;font-size:1.5cqw;line-height:1.7;color:var(--faint);
          white-space:pre-line;position:relative}
        #f3 .look .notimp .bar{position:absolute;left:-.2cqw;top:1.35cqw;height:1px;width:0;background:var(--line2);transform-origin:0 50%}

        #f3 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f3" data-composition-id="frame-03" data-width="1920" data-height="1080" data-duration="17.71">
        <div id="f3-clip" class="clip" data-start="0" data-duration="17.71" data-track-index="0">
          <div class="ground"></div>
          <div class="prog" id="f3-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.02</span><span class="r">03 — 07</span></div>
            <div class="rule" id="f3-rule"></div>

            <div class="h" id="f3-h">上下文是个<em>容器</em>。</div>

            <div class="bracket" id="f3-bracket"><b></b><i></i></div>

            <div class="keys" id="f3-keys">
              <div class="k" data-i="0">
                <span class="key">ctx<i>.</i>tools</span>
                <span class="desc">工具注册表<br />模型能调用的每一个工具</span>
                <span class="impl">ToolsService</span>
              </div>
              <div class="k" data-i="1">
                <span class="key">ctx<i>.</i>llm</span>
                <span class="desc">模型适配器<br />流式补全与 token 计数</span>
                <span class="impl">LlmRuntime</span>
              </div>
              <div class="k" data-i="2">
                <span class="key">ctx<i>.</i>sessions</span>
                <span class="desc">会话日志<br />只追加的事件流</span>
                <span class="impl">SessionStore</span>
              </div>
            </div>

            <div class="look" id="f3-look">
              <div class="k2">按 key 查找</div>
              <div class="row"><span class="r">ctx</span><span>.</span><span>tools</span><span class="a">→</span><span class="r">ToolsService</span></div>
              <div class="note">谁写的、怎么实现的，调用方不知道。</div>
              <div class="notimp">import { ToolsService }
  from '@deepseek-ai/dsh-tools'<span class="bar" id="f3-notimpbar"></span></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f3");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var qa = function (s) { return root.querySelectorAll(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f3-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);

          // 0.00–1.45 「上下文是个容器。」
          tl.fromTo(q("#f3-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.05);

          // 1.67–10.93 「每项能力占一个固定的键：ctx.tools、ctx.llm、ctx.sessions。」
          var rows = qa("#f3-keys .k");
          var at = [2.35, 4.45, 6.5];
          for (var i = 0; i < rows.length; i++) {
            tl.fromTo(rows[i], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .38, ease: "power3.out" }, at[i]);
          }
          tl.fromTo(q("#f3-bracket"), { opacity: 0 }, { opacity: .8, duration: .5 }, 9.2);

          // 11.15–14.47 「别人按这个键找它，不关心它是谁写的。」
          tl.fromTo(q("#f3-look"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, 8.4);

          // 14.69–17.21 「插件之间，从不互相 import。」
          tl.fromTo(q("#f3-notimpbar"), { width: 0 }, { width: "27cqw", duration: .5, ease: "power2.inOut" }, 14.85);

          tl.fromTo(q("#f3-prog"), { scaleX: 0 }, { scaleX: 1, duration: 17.71, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-03"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
