<span class="kw">export const</span> inject = [<span class="st">'tools'</span>]</div>

          // 0.00–2.17 「依赖不靠导入，靠声明。」

          tl.fromTo(qa("#f4-cfg .row"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: .3, stagger: .07, ease: "power2.out" }, 0.55);
          tl.fromTo(q("#f4-cfg .ttl"), { opacity: 0 }, { opacity: 1, duration: .3 }, 0.5);

          // 2.39–7.60 「inject 里写下你要的服务，它就等这些服务就绪，才开始跑。」
