<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-01 · 一个插件到底是什么</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f1 {
          --canvas:#0A0B0D; --line:#232833; --line2:#39404E;
          --text:#EDEAE3; --muted:#A7AEB9; --faint:#7E8590;
          --accent:#4D6BFE; --paper:#E9E4D8;
          position:absolute; inset:0; width:100%; height:100%;
          display:block; overflow:hidden; container-type:size;
          background:transparent;
        }
        #f1 *{box-sizing:border-box;margin:0;padding:0}
        #f1 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f1 .plane{position:absolute;inset:0}

        #f1 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
          color:var(--faint)}
        #f1 .chrome .r{color:var(--muted)}
        #f1 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f1 .from{position:absolute;left:6cqw;top:14%;font-family:'JB',monospace;font-size:1.5cqw;
          letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

        #f1 .q{position:absolute;left:6cqw;top:20.5%;font-family:'Inter',sans-serif;font-weight:900;
          font-size:6.6cqw;letter-spacing:-.045em;line-height:.98;color:var(--text);white-space:nowrap}
        #f1 .q em{font-style:normal;color:var(--paper)}

        #f1 .ask{position:absolute;left:6cqw;top:38.5%;font-family:'Inter',sans-serif;font-weight:500;
          font-size:2.15cqw;letter-spacing:-.01em;color:var(--muted);white-space:nowrap}

        #f1 .yaml{position:absolute;left:6cqw;top:52%;font-family:'JB',monospace;font-size:1.85cqw;
          color:var(--muted);letter-spacing:0;white-space:nowrap;position:absolute}
        #f1 .yaml .k{color:var(--faint)}
        #f1 .yaml .s{color:var(--text)}
        #f1 .strike{position:absolute;left:6cqw;top:calc(52% + 1.1cqw);height:1px;width:0;background:var(--line2);transform-origin:0 50%}

        #f1 .obj{position:absolute;left:6cqw;top:64%;display:flex;align-items:baseline;gap:1.4cqw}
        #f1 .obj .lead{font-family:'Inter',sans-serif;font-weight:400;font-size:2.15cqw;color:var(--faint)}
        #f1 .obj .w{font-family:'Inter',sans-serif;font-weight:900;font-size:5.4cqw;letter-spacing:-.04em;color:var(--accent);line-height:1}
        #f1 .obj .en{font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}


        #f1 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f1" data-composition-id="frame-01" data-width="1920" data-height="1080" data-duration="9.85">
        <div id="f1-clip" class="clip" data-start="0" data-duration="9.85" data-track-index="0">
          <div class="ground"></div>
          <div class="prog" id="f1-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.02</span><span class="r">01 — 07</span></div>
            <div class="rule" id="f1-rule"></div>

            <div class="from" id="f1-from">EP.01 的结论</div>

            <div class="q" id="f1-q">一切皆<em>插件</em>。</div>
            <div class="ask" id="f1-ask">那一个插件，到底是什么东西？</div>

            <div class="yaml" id="f1-yaml"><span class="k">- name:</span> <span class="s">'@deepseek-ai/dsh-tools'</span></div>
            <div class="strike" id="f1-strike"></div>

            <div class="obj" id="f1-obj">
              <span class="lead">是</span>
              <span class="w">一个对象</span>
              <span class="en">object</span>
            </div>

          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f1");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f1-rule"), { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, 0);

          // 0.00–3.67 「上一集说，dsh 里没有内核，一切皆插件。」
          tl.fromTo(q("#f1-from"), { opacity: 0 }, { opacity: 1, duration: .4 }, 0.12);
          tl.fromTo(q("#f1-q"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .6, ease: "power3.out" }, 0.18);

          // 3.90–6.24 「那一个插件，到底是什么东西？」
          tl.fromTo(q("#f1-ask"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, 3.9);
          tl.to(q("#f1-q"), { opacity: .42, duration: .5, ease: "power2.inOut" }, 3.9);

          // 6.46–8.27 「不是配置文件里的一行字。」— a config line appears, then is struck out
          tl.fromTo(q("#f1-yaml"), { opacity: 0, y: 8 }, { opacity: .95, y: 0, duration: .38, ease: "power3.out" }, 6.46);
          tl.to(q("#f1-strike"), { width: "29cqw", duration: .42, ease: "power2.inOut" }, 7.0);

          // 8.49–9.35 「是一个对象。」
          tl.fromTo(q("#f1-obj"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 8.49);

          tl.fromTo(q("#f1-prog"), { scaleX: 0 }, { scaleX: 1, duration: 9.85, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
