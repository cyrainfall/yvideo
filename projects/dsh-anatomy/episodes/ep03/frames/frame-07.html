<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-07 · 树是叠出来的</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f7{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#7E8590;
          --accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size;background:transparent}
        #f7 *{box-sizing:border-box;margin:0;padding:0}
        #f7 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f7 .plane{position:absolute;inset:0}

        #f7 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f7 .chrome .r{color:var(--muted)}
        #f7 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f7 .h{position:absolute;left:6cqw;top:12%;font-family:'Inter',sans-serif;font-weight:800;
          font-size:3.6cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        #f7 .h em{font-style:normal;color:var(--paper)}

        /* ── the stack, compressed ─────────────────────────────────────── */
        #f7 .stack{position:absolute;left:6cqw;top:25%;width:46cqw}
        #f7 .band{display:flex;align-items:center;height:5.4cqw;border-top:1px solid var(--line);
          font-family:'JB',monospace;font-size:1.5cqw;color:var(--muted);padding-left:0}
        #f7 .band:last-child{border-bottom:1px solid var(--line)}
        #f7 .band .nm{white-space:nowrap}
        #f7 .band .n{margin-left:auto;font-size:1.5cqw;letter-spacing:.08em;color:var(--faint)}

        #f7 .mine{position:relative}
        #f7 .mine .mark{position:absolute;left:-1.4cqw;top:0;bottom:0;width:2px;background:var(--accent);
          transform-origin:50% 0;transform:scaleY(0)}
        #f7 .mine .nm{color:var(--text)}
        #f7 .mine .n{color:var(--accent)}
        #f7 .mine .tag{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:1.6cqw;
          font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.14em;text-transform:uppercase;
          color:var(--accent);white-space:nowrap;opacity:0}

        /* ── closing ───────────────────────────────────────────────────── */
        #f7 .close{position:absolute;left:60cqw;top:26%;width:34cqw}
        #f7 .close .l1{font-family:'Inter',sans-serif;font-weight:700;font-size:2.0cqw;letter-spacing:-.02em;
          line-height:1.35;color:var(--text)}
        #f7 .close .l2{margin-top:1.1cqw;font-family:'Inter',sans-serif;font-size:1.55cqw;line-height:1.5;color:var(--muted)}

        #f7 .next{position:absolute;left:6cqw;top:80%;display:flex;align-items:baseline;gap:1.4cqw;opacity:0}
        #f7 .next .ep{font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
        #f7 .next .ti{font-family:'Inter',sans-serif;font-weight:700;font-size:2.1cqw;letter-spacing:-.02em;color:var(--paper)}
        #f7 .next .kw{font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);letter-spacing:.06em}

        #f7 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f7" data-composition-id="frame-07" data-width="1920" data-height="1080" data-duration="15.00">
        <div id="f7-clip" class="clip" data-start="0" data-duration="15.00" data-track-index="0">
          <div class="ground"></div>
          <div class="prog" id="f7-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.03</span><span class="r">07 — 07</span></div>
            <div class="rule" id="f7-rule"></div>

            <div class="h" id="f7-h">不是写出来的，是<em>叠</em>出来的。</div>

            <div class="stack" id="f7-stack">
              <div class="band" data-i="0"><span class="nm">profile 的 18 个 bundle</span><span class="n">先</span></div>
              <div class="band mine" data-i="1"><span class="mark"></span><span class="nm">profiles/web/cordis.patch.yml</span><span class="n">你的</span></div>
              <div class="band" data-i="2"><span class="nm">home patch</span></div>
              <div class="band" data-i="3"><span class="nm">--patch overlay</span><span class="n">最后</span></div>
            </div>

            <div class="close" id="f7-close">
              <div class="l1">每一层都能单独读、单独改、单独撤。</div>
              <div class="l2">你的那一层里，只会有你动过的那几行。</div>
            </div>

            <div class="next" id="f7-next">
              <span class="ep">EP.04</span>
              <span class="ti">一轮对话</span>
              <span class="kw">turn · step · 只追加的日志</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f7");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var qa = function (s) { return root.querySelectorAll(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f7-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);

          // 0.00–2.61 「这棵树不是写出来的，是叠出来的。」
          tl.fromTo(q("#f7-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .55, ease: "power3.out" }, 0.05);
          tl.fromTo(qa("#f7-stack .band"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: .32, stagger: .16, ease: "power2.out" }, 0.5);

          // 2.83–6.30 「每一层都能单独读、单独改、单独撤。」
          tl.fromTo(q("#f7-close .l1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, 2.86);

          // 6.52–10.08 「你自己那一层，只有你动过的那几行。」
          tl.to(q("#f7-stack .mine"), { backgroundColor: "rgba(77,107,254,0.05)", duration: .4 }, 6.89);
          tl.fromTo(q("#f7-stack .mine .mark"), { scaleY: 0 }, { scaleY: 1, duration: .45, ease: "power2.out" }, 6.95);
          tl.fromTo(q("#f7-close .l2"), { opacity: 0 }, { opacity: 1, duration: .45 }, 7.25);

          // 10.30–13.80 「下一集，跟着一句话，走完一轮对话。」
          tl.fromTo(q("#f7-next"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 10.62);

          tl.fromTo(q("#f7-prog"), { scaleX: 0 }, { scaleX: 1, duration: 15.00, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-07"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
