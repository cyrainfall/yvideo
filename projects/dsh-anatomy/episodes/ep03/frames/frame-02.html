<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-02 · profile 与 bundle</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f2{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#7E8590;
          --accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size;background:transparent}
        #f2 *{box-sizing:border-box;margin:0;padding:0}
        #f2 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f2 .plane{position:absolute;inset:0}

        #f2 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f2 .chrome .r{color:var(--muted)}
        #f2 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f2 .h{position:absolute;left:6cqw;top:11.5%;font-family:'Inter',sans-serif;font-weight:800;
          font-size:3.3cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        #f2 .h em{font-style:normal;color:var(--paper)}

        /* ── two columns ────────────────────────────────────────────────── */
        #f2 .col{position:absolute;top:22%}
        #f2 .col.l{left:6cqw;width:40cqw}
        #f2 .col.r{left:52cqw;width:42cqw}
        #f2 .col .k{font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
        #f2 .col .def{margin-top:.6cqw;font-family:'Inter',sans-serif;font-size:1.5cqw;color:var(--faint)}

        #f2 .names{margin-top:1.6cqw;border-top:1px solid var(--line)}
        #f2 .name{display:flex;align-items:center;height:3.9cqw;border-bottom:1px solid var(--line);
          font-family:'JB',monospace;font-size:1.55cqw;color:var(--text)}
        #f2 .name .n{margin-left:auto;font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);letter-spacing:.08em}

        #f2 .code{margin-top:1.8cqw;font-family:'JB',monospace;font-size:1.5cqw;line-height:1.85;
          white-space:pre;color:var(--muted);opacity:0;font-variant-ligatures:none}
        #f2 .code .s{color:var(--paper)}
        #f2 .code .k2{color:#8C93A0}
        #f2 .code .dim{color:var(--faint)}

        #f2 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f2" data-composition-id="frame-02" data-width="1920" data-height="1080" data-duration="16.9">
        <div id="f2-clip" class="clip" data-start="0" data-duration="16.9" data-track-index="1">
          <div class="ground"></div>
          <div class="prog" id="f2-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.03</span><span class="r">02 — 07</span></div>
            <div class="rule" id="f2-rule"></div>

            <div class="h" id="f2-h">两样东西：<em>profile</em> 与 <em>bundle</em></div>

            <div class="col l" id="f2-l">
              <div class="k">profile</div>
              <div class="def">一个具名组装，住在 Harness home 里。</div>
              <div class="names" id="f2-names">
                <div class="name">web<span class="n">本机在跑</span></div>
                <div class="name">headless<span class="n"></span></div>
                <div class="name">sdk<span class="n"></span></div>
                <div class="name">sdk-minimal<span class="n"></span></div>
                <div class="name">acp<span class="n"></span></div>
              </div>
              <div class="code" id="f2-codel"><span class="dim">// profiles/web/package.json</span>
<span class="k2">"dsh"</span>: { <span class="k2">"profile"</span>: { <span class="k2">"bundles"</span>: [
  <span class="s">"@deepseek-ai/dsh-base"</span>, <span class="dim">… 18 条</span>
] } }</div>
            </div>

            <div class="col r" id="f2-r">
              <div class="k">bundle</div>
              <div class="def">一份配置项，加上它自己的挂载代码。</div>
              <div class="names" id="f2-bnames">
                <div class="name">@deepseek-ai/dsh-base<span class="n">web / headless / sdk / acp 共用</span></div>
                <div class="name">@deepseek-ai/dsh-web-app<span class="n">加浏览器应用</span></div>
              </div>
              <div class="code" id="f2-coder"><span class="dim">// bundle/base/package.json</span>
<span class="k2">"dsh"</span>: { <span class="k2">"bundle"</span>: {
  <span class="k2">"patch"</span>: <span class="s">"./cordis.patch.yml"</span> } }</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f2");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var qa = function (s) { return root.querySelectorAll(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f2-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);

          // 0.00–1.41 「它由两样东西拼出来。」
          tl.fromTo(q("#f2-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.05);
          tl.fromTo([q("#f2-l .k"), q("#f2-r .k")], { opacity: 0 }, { opacity: 1, duration: .4, stagger: .12 }, 0.7);
          tl.fromTo([q("#f2-l .def"), q("#f2-r .def")], { opacity: 0 }, { opacity: 1, duration: .4, stagger: .12 }, 0.85);

          // 1.63–8.44 「profile，是一个具名组装，web、headless、sdk，都只是名字。」
          tl.fromTo(qa("#f2-names .name"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: .28, stagger: .1, ease: "power2.out" }, 1.7);

          // 8.66–11.74 「bundle，是可以再被上层改的分发格式。」
          tl.fromTo(qa("#f2-bnames .name"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: .3, stagger: .14, ease: "power2.out" }, 9.0);

          // 11.96–15.72 「两边都靠 package.json 里的一个字段，自报家门。」
          tl.fromTo(q("#f2-codel"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, 12.0);
          tl.fromTo(q("#f2-coder"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, 12.5);
          tl.to(q("#f2-names .name .n"), { color: "#4D6BFE", duration: .35 }, 12.9);
          tl.to(q("#f2-bnames .name .n"), { color: "#4D6BFE", duration: .35 }, 13.2);

          tl.fromTo(q("#f2-prog"), { scaleX: 0 }, { scaleX: 1, duration: 16.9, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
