<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-04 · patch 只做两件事</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f4{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#7E8590;
          --accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size;background:transparent}
        #f4 *{box-sizing:border-box;margin:0;padding:0}
        #f4 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f4 .plane{position:absolute;inset:0}

        #f4 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f4 .chrome .r{color:var(--muted)}
        #f4 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f4 .h{position:absolute;left:6cqw;top:11%;font-family:'Inter',sans-serif;font-weight:800;
          font-size:3.3cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        #f4 .h em{font-style:normal;color:var(--paper)}

        #f4 .pane{position:absolute;top:22.5%}
        #f4 .pane.l{left:6cqw;width:44cqw}
        #f4 .pane.r{left:54cqw;width:40cqw}
        #f4 .k{font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
        #f4 .k2{position:absolute;left:0;top:0;font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.16em;
          text-transform:uppercase;color:var(--muted);opacity:0}
        #f4 .path{margin-top:.45cqw;font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);white-space:nowrap}

        #f4 .codebox{position:relative;height:22cqw;margin-top:1.4cqw}
        #f4 .code{position:absolute;left:0;top:0;font-family:'JB',monospace;font-size:1.5cqw;line-height:1.95;
          white-space:pre;color:var(--muted);font-variant-ligatures:none}
        #f4 .code .key{color:#8C93A0}
        #f4 .code .id{color:var(--text)}
        #f4 .code .v{color:var(--paper)}
        #f4 .code .dim{color:var(--faint)}
        #f4 .code .ins{color:var(--accent)}

        #f4 .note{margin-top:.9cqw;font-family:'Inter',sans-serif;font-size:1.5cqw;line-height:1.5;color:var(--muted)}
        #f4 .note b{color:var(--text);font-weight:600}

        #f4 .consequence{position:absolute;left:6cqw;top:78%;width:88cqw;opacity:0;
          font-family:'Inter',sans-serif;font-size:1.6cqw;color:var(--paper);white-space:nowrap}
        #f4 .consequence b{color:var(--accent);font-weight:600}

        #f4 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f4" data-composition-id="frame-04" data-width="1920" data-height="1080" data-duration="16.88">
        <div id="f4-clip" class="clip" data-start="0" data-duration="16.88" data-track-index="1">
          <div class="ground"></div>
          <div class="prog" id="f4-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.03</span><span class="r">04 — 07</span></div>
            <div class="rule" id="f4-rule"></div>

            <div class="h" id="f4-h">patch 只做<em>两件事</em>。</div>

            <!-- left: the patch file -->
            <div class="pane l" id="f4-left">
              <div class="k" id="f4-lk1">第一件 · 按 id 替换</div>
              <div class="k2" id="f4-lk2">第二件 · insert</div>
              <div class="path" id="f4-lp">~/.dsh/profiles/web/cordis.patch.yml</div>

              <div class="codebox">
                <div class="code" id="f4-setA"><span class="dim"># 一行的 config，整块换掉</span>
<span class="key">- id:</span> <span class="id">typert-gateway</span>
  <span class="key">config:</span>
    <span class="key">websocketHeartbeatIntervalMs:</span> <span class="v">15000</span></div>

                <div class="code" id="f4-setB" style="opacity:0"><span class="dim"># insert：插一行原本没有的</span>
<span class="ins">- insert:</span>
    <span class="key">- id:</span> <span class="id">panel-mcp-ypicture</span>
      <span class="key">name:</span> <span class="v">'@deepseek-ai/dsh-mcp-client'</span>
      <span class="key">config:</span>
        <span class="key">serverName:</span> <span class="v">ypicture</span></div>
              </div>
            </div>

            <!-- right: the result -->
            <div class="pane r" id="f4-right">
              <div class="k" id="f4-rk">dump 里那一行</div>
              <div class="path" id="f4-rp">dsh --profile web --dump-config</div>

              <div class="codebox">
                <div class="code" id="f4-setC"><span class="key">- id:</span> <span class="id">typert-gateway</span>
  <span class="key">config:</span>
    <span class="key">websocketHeartbeatIntervalMs:</span> <span class="v">15000</span>
<span class="dim"># == dsh-base, patched by your patch</span></div>

                <div class="code" id="f4-setD" style="opacity:0"><span class="key">- id:</span> <span class="id">panel-mcp-ypicture</span>
  <span class="key">name:</span> <span class="v">'@deepseek-ai/dsh-mcp-client'</span>
  <span class="key">config:</span>
    <span class="key">serverName:</span> <span class="v">ypicture</span>
<span class="dim"># == ~/.dsh/profiles/web/cordis.patch.yml</span></div>
              </div>

              <div class="note" id="f4-noteA">换的是<b>整块</b> config，不是合并。</div>
              <div class="note" id="f4-noteB" style="opacity:0">原来没有这一行，现在有了。</div>
            </div>

            <div class="consequence" id="f4-cons">所以想改一个字段，整块 <b>config</b> 都得重新写一遍。</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f4");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f4-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);

          // 0.00–2.65 「patch 的语法很小，只做两件事。」
          tl.fromTo(q("#f4-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.05);
          tl.fromTo([q("#f4-lk1"), q("#f4-lp")], { opacity: 0 }, { opacity: 1, duration: .4, stagger: .1 }, 0.8);

          // 2.87–7.70 「按 id 找到一行，把它的整个 config 换掉，不是合并。」
          tl.fromTo(q("#f4-setA"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, 3.12);
          tl.fromTo([q("#f4-rk"), q("#f4-rp")], { opacity: 0 }, { opacity: 1, duration: .4, stagger: .1 }, 4.1);
          tl.fromTo(q("#f4-setC"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, 4.5);
          tl.fromTo(q("#f4-noteA"), { opacity: 0 }, { opacity: 1, duration: .4 }, 5.9);

          // 7.92–10.84 「或者 insert，插一行原本没有的。」
          tl.to([q("#f4-setA"), q("#f4-setC"), q("#f4-noteA")], { opacity: 0, duration: .3 }, 8.45);
          tl.to(q("#f4-lk1"), { opacity: 0, duration: .25 }, 8.50);
          tl.to(q("#f4-lk2"), { opacity: 1, duration: .25 }, 8.63);
          tl.fromTo(q("#f4-setB"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, 8.68);
          tl.fromTo(q("#f4-setD"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, 9.0);
          tl.fromTo(q("#f4-noteB"), { opacity: 0 }, { opacity: 1, duration: .4 }, 10.3);

          // 11.06–15.31 「所以想改一个字段，你得把那一整块，重新写一遍。」
          tl.fromTo(q("#f4-cons"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, 11.55);

          tl.fromTo(q("#f4-prog"), { scaleX: 0 }, { scaleX: 1, duration: 16.88, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-04"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
