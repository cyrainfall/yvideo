        #f1 .blk .code{margin-top:.85cqw;font-family:'JB',monospace;font-size:1.6cqw;line-height:1.66;color:var(--text);

      <script>
        (function () {
          var root = document.getElementById("f1");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f1-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);
          tl.fromTo(q("#f1-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.05);

          // 0.00–4.82 「上一集拆到一半：一轮对话里，有个东西还没有打开。」

          // 5.04–5.57 「工具。」—— 主语上屏
          tl.fromTo(q("#f1-noun"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 5.0);
          tl.fromTo(q("#f1-gloss"), { opacity: 0 }, { opacity: 1, duration: .4 }, 5.5);
          tl.fromTo(q("#f1-gloss2"), { opacity: 0 }, { opacity: 1, duration: .4 }, 5.9);

          tl.fromTo(q("#f1-name"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .4, ease: "power2.out" }, 6.3);

          tl.fromTo(q("#f1-seam"), { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, 9.9);
          tl.fromTo(q("#f1-seamlab"), { opacity: 0 }, { opacity: 1, duration: .4 }, 10.3);

          // 13.30–20.73 「模型写一条调用，harness 找到实现，跑完把结果写成一条消息，还给它。」

          tl.fromTo(q("#f1-prog"), { scaleX: 0 }, { scaleX: 1, duration: 21.233, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-01"] = tl;
