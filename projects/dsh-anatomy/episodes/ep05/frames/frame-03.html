<!doctype html>

  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f3{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#7E8590;
          --accent:#4D6BFE;--paper:#E9E4D8;

        #f3 *{box-sizing:border-box;margin:0;padding:0}
        #f3 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f3 .plane{position:absolute;inset:0}

        #f3 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f3 .chrome .r{color:var(--muted)}
        #f3 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f3 .h{position:absolute;left:6cqw;top:11.5%;font-family:'Inter',sans-serif;font-weight:800;
          font-size:3.1cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        #f3 .h em{font-style:normal;color:var(--paper)}
        #f3 .sub{position:absolute;left:6cqw;top:19.2%;width:80cqw;font-family:'Inter',sans-serif;font-size:1.58cqw;
          line-height:1.6;color:var(--muted)}

        #f3 .spine{position:absolute;left:6cqw;right:6cqw;top:26.4%;height:1px;background:var(--line2);
          transform-origin:0 50%;transform:scaleX(0)}

        /* 站 */
        #f3 .st{position:absolute;top:26.4%;width:17.4cqw}
        #f3 .st .tick{position:absolute;left:0;top:-.7cqw;width:1px;height:.7cqw;background:var(--line2);
          transform-origin:50% 100%;transform:scaleY(0)}
        #f3 .st .nm{font-family:'JB',monospace;font-size:1.55cqw;color:var(--text);white-space:nowrap;
          position:absolute;left:0;top:1.0cqw;opacity:0}
        #f3 .st .gl{position:absolute;left:0;top:3.7cqw;font-family:'Inter',sans-serif;font-size:1.5cqw;
          line-height:1.5;color:var(--muted);width:16.4cqw;opacity:0}

        #f3 .dec{position:absolute;top:8.4cqw;left:0;opacity:0}

        #f3 .dec .d b{font-weight:400;color:var(--text)}

        /* 代码 */
        #f3 .code{position:absolute;left:6cqw;top:60.6%;width:88cqw;opacity:0}

        #f3 .code .ln .no{color:var(--faint)}

        #f3 .cite{position:absolute;left:6cqw;top:78%;font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);opacity:0}
        #f3 .cite b{font-weight:400;color:var(--muted)}

        #f3 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}

        <div id="f3-clip" class="clip" data-start="0" data-duration="35.819" data-track-index="1">
          <div class="ground"></div>
          <div class="prog" id="f3-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.05</span><span class="r">03 — 07</span></div>
            <div class="rule" id="f3-rule"></div>

            <div class="sub" id="f3-sub">从「模型说了一句话」到「一个进程跑完」，中间五站，其中三站可以被别人改写。</div>

            <div class="spine" id="f3-spine"></div>

            <div class="st" id="f3-s1" style="left:6cqw">
              <div class="tick"></div>
              <div class="nm" id="f3-n1">pre-execute</div>
              <div class="gl" id="f3-g1">瀑布。每个监听者都能表态。</div>
              <div class="dec" id="f3-d1">
                <div class="d"><b>allow</b>  放行</div>
                <div class="d"><b>deny</b>   拒绝，带理由</div>
                <div class="d"><b>cancel</b> 取消</div>
                <div class="d"><b>ask</b>    问人</div>
              </div>
            </div>

            <div class="st" id="f3-s2" style="left:23.6cqw">
              <div class="tick"></div>
              <div class="nm" id="f3-n2">guards</div>
              <div class="gl" id="f3-g2">单调守卫。只在前一段同意之后跑。</div>
              <div class="dec" id="f3-d2">
                <div class="d"><b>拒绝</b>  带理由</div>
                <div class="d"><b>不管</b>  交下去</div>
                <div class="d"><span class="x">没有 allow</span></div>
              </div>
            </div>

            <div class="st" id="f3-s3" style="left:41.2cqw">
              <div class="tick"></div>
              <div class="nm" id="f3-n3">execute</div>
              <div class="gl" id="f3-g3">环绕分发。壳可以换信号、改结果。</div>
              <div class="dec" id="f3-d3">
                <div class="d"><b>timeoutMs</b></div>
                <div class="d"><b>metrics</b></div>
                <div class="d"><span class="x">里面才是 execute()</span></div>
              </div>
            </div>

            <div class="st" id="f3-s4" style="left:58.8cqw">
              <div class="tick"></div>
              <div class="nm" id="f3-n4">post-execute</div>
              <div class="gl" id="f3-g4">瀑布。结果在这里被接受或被驳回。</div>
              <div class="dec" id="f3-d4">
                <div class="d"><b>accept</b>   原样</div>
                <div class="d"><b>accept</b>   换内容</div>

              </div>

              <div class="tick"></div>
              <div class="nm" id="f3-n5">tool/result</div>
              <div class="gl" id="f3-g5">冻结一份，只读。</div>
              <div class="dec" id="f3-d5">
                <div class="d"><b>tools/result</b></div>
                <div class="d"><span class="x">只读</span></div>
              </div>
            </div>

            <div class="code" id="f3-code">
              <div class="ln"><span class="no">201</span>  <span class="k">waterfall</span>('tools/pre-execute',  exec, () =&gt; allow)</div>
              <div class="ln"><span class="no">214</span>  <span class="k">checkGuards</span>(exec)            <span style="color:#7E8590">// 只可能拿到拒绝</span></div>
              <div class="ln" id="f3-l3"><span class="no">311</span>  <span class="k">waterfall</span>('tools/execute',      exec, () =&gt; body())</div>
              <div class="ln"><span class="no">509</span>  <span class="k">waterfall</span>('tools/post-execute', exec, result, () =&gt; accept)</div>
            </div>
            <div class="cite" id="f3-cite">packages/core/tools/src/<b>pipeline.ts</b></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f3");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var qa = function (s) { return root.querySelectorAll(s); };
          var ACCENT = "#4D6BFE", TEXT = "#EDEAE3";

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f3-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);
          tl.fromTo(q("#f3-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.05);
          tl.fromTo(q("#f3-spine"), { scaleX: 0 }, { scaleX: 1, duration: .7, ease: "power2.out" }, 0.5);
          tl.fromTo(q("#f3-sub"), { opacity: 0 }, { opacity: 1, duration: .5 }, 0.8);

          // 五站先全部上屏：这是一张地图，旁白随后一站一站点亮
          tl.fromTo(qa(".st .tick"), { scaleY: 0 }, { scaleY: 1, duration: .3, ease: "power2.out", stagger: .1 }, 0.55);
          tl.fromTo(qa(".st .nm"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .35, ease: "power2.out", stagger: .1 }, 0.7);
          tl.fromTo(q("#f3-code"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 1.7);

          // 0.00–4.67 「一次调用进来，先过第一段：pre-execute，一个瀑布。」
          tl.to(q("#f3-n1"), { color: ACCENT, duration: .4 }, 1.6);
          tl.fromTo(q("#f3-g1"), { opacity: 0 }, { opacity: 1, duration: .4 }, 3.0);

          // 4.89–12.02 「每个监听者都能交出四种决定：放行、拒绝、取消、问人。」
          tl.fromTo(q("#f3-d1"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .4 }, 5.0);
          tl.fromTo(q("#f3-d1 .d"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .3, stagger: .55 }, 5.3);

          // 12.24–19.83 「然后是一层守卫。守卫只有两种返回：拒绝，或者不管。」
          tl.to(q("#f3-n1"), { color: TEXT, duration: .4 }, 12.2);
          tl.to(q("#f3-n2"), { color: ACCENT, duration: .4 }, 12.4);
          tl.fromTo(q("#f3-g2"), { opacity: 0 }, { opacity: 1, duration: .4 }, 13.2);
          tl.fromTo(q("#f3-d2"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .4 }, 14.3);
          tl.fromTo(q("#f3-d2 .d"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .3, stagger: .7 }, 14.6);

          // 20.05–22.68 「顺序再怎么排，也翻不回允许。」
          tl.to(q("#f3-d2 b"), { color: ACCENT, duration: .4, stagger: .1 }, 20.2);
          tl.to(q("#f3-d1"), { opacity: .38, duration: .5 }, 20.6);

          // 22.90–28.02 「再往下是第二段：execute，一层环绕分发。」
          tl.to(q("#f3-n2"), { color: TEXT, duration: .4 }, 22.9);
          tl.to(q("#f3-d2 b"), { color: "#A7AEB9", duration: .4 }, 23.0);
          tl.to(q("#f3-n3"), { color: ACCENT, duration: .4 }, 23.3);
          tl.fromTo(q("#f3-g3"), { opacity: 0 }, { opacity: 1, duration: .4 }, 24.4);
          tl.fromTo(q("#f3-d3"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .4 }, 25.2);
          tl.fromTo(q("#f3-d3 .d"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .3, stagger: .5 }, 25.5);

          // 28.24–32.34 「超时、指标都挂在这里，工具本身不用知道。」
          tl.to(q("#f3-l3 .no"), { color: "#4D6BFE", duration: .4 }, 28.3);

          // 32.56–35.32 「跑完是第三段：post-execute。」
          tl.to(q("#f3-n3"), { color: TEXT, duration: .4 }, 32.5);
          tl.to(q("#f3-l3 .no"), { color: "#7E8590", duration: .4 }, 32.5);
          tl.to(q("#f3-n4"), { color: ACCENT, duration: .4 }, 32.8);
          tl.fromTo(q("#f3-g4"), { opacity: 0 }, { opacity: 1, duration: .4 }, 33.2);
          tl.fromTo(q("#f3-d4"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .4 }, 33.5);
          tl.fromTo(q("#f3-g5"), { opacity: 0 }, { opacity: 1, duration: .4 }, 33.9);
          tl.fromTo(q("#f3-d5"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .35 }, 34.1);
          tl.fromTo(q("#f3-cite"), { opacity: 0 }, { opacity: 1, duration: .4 }, 30.4);

          tl.fromTo(q("#f3-prog"), { scaleX: 0 }, { scaleX: 1, duration: 35.819, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-03"] = tl;
        })();
      </script>
    </template>
  </body>
