<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-05 · 后三站</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f5{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#787F8B;--accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size}
        #f5 *{box-sizing:border-box;margin:0;padding:0}
        #f5 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f5 .plane{position:absolute;inset:0}

        .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

        .rail{position:absolute;left:6cqw;right:6cqw;top:44%;height:1px;background:var(--line2)}
        .fill{position:absolute;left:6cqw;top:44%;height:1px;width:36.7cqw;background:var(--accent);transform-origin:0 50%}
        .fill2{position:absolute;left:42.67cqw;top:44%;height:1px;width:44cqw;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}

        .st{position:absolute;top:44%;transform:translate(-50%,0);width:12cqw;text-align:center}
        .st .num{position:absolute;left:50%;transform:translateX(-50%);top:-5.4cqw;font-family:'JB',monospace;font-size:1.45cqw;
          color:var(--faint);letter-spacing:.12em}
        .st .tick{position:absolute;left:50%;top:-2.4cqw;width:1px;height:2.4cqw;background:var(--line2)}
        .st .dot{position:absolute;left:50%;top:-.34cqw;width:.68cqw;height:.68cqw;margin-left:-.34cqw;border:1px solid var(--line2);background:var(--canvas)}
        .st .nm{position:absolute;left:0;right:0;top:1.5cqw;font-family:'Inter',sans-serif;font-weight:600;font-size:1.75cqw;color:var(--faint)}
        .st.done .nm{color:var(--muted)}
        .st.done .dot{border-color:var(--accent);background:rgba(77,107,254,.55)}

        .panel{position:absolute;left:6cqw;top:56%;width:66cqw}
        .panel .k{font-family:'JB',monospace;font-size:1.45cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        .beat{position:absolute;left:0;top:2.4cqw;opacity:0}
        .beat .code{font-family:'JB',monospace;font-size:1.75cqw;color:var(--paper);white-space:nowrap}
        .beat .code b{color:var(--accent);font-weight:500}
        .beat .path{margin-top:1.0cqw;font-family:'JB',monospace;font-size:1.45cqw;color:var(--muted)}

        .log{position:absolute;right:6cqw;top:56%;width:20cqw}
        .log .k{opacity:0;font-family:'JB',monospace;font-size:1.45cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);text-align:right}
        .ln{margin-top:.85cqw;padding-top:.55cqw;border-top:1px solid var(--line);font-family:'JB',monospace;
          font-size:1.45cqw;color:var(--paper);text-align:right;letter-spacing:.01em}
        .ln span{color:var(--faint);margin-right:.5cqw}

        #f5-arc{position:absolute;inset:0;width:100%;height:100%}
        .arclabel{position:absolute;left:50%;top:19.5%;transform:translateX(-50%);font-family:'Inter',sans-serif;
          font-weight:500;font-size:1.62cqw;color:var(--muted);text-align:center;opacity:0}
        .arclabel b{color:var(--accent);font-weight:600}

        .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f5" data-composition-id="frame-05" data-width="1920" data-height="1080" data-duration="19.85">
        <div id="f5-clip" class="clip" data-start="0" data-duration="19.85" data-track-index="0">
          <div class="ground"></div>
          <div class="prog" id="f5-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.01</span><span>05 — 08</span></div>

            <svg id="f5-arc" viewBox="0 0 1920 1080" aria-hidden="true" data-layout-ignore>
              <path id="f5-path" d="M1664 475 C1664 250 537 250 537 475" fill="none" stroke="#4D6BFE" stroke-width="2" opacity=".9"/>
            </svg>
            <div class="arclabel" id="f5-arclabel">下一轮不回放视频，它<b>重新读一遍日志</b></div>

            <div class="rail"></div>
            <div class="fill"></div>
            <div class="fill2" id="f5-fill2"></div>

            <div class="st done" style="left:13.33cqw"><div class="num">01</div><div class="tick"></div><div class="dot"></div><div class="nm">启动</div></div>
            <div class="st done" style="left:28cqw"><div class="num">02</div><div class="tick"></div><div class="dot"></div><div class="nm">输入</div></div>
            <div class="st done" style="left:42.67cqw"><div class="num">03</div><div class="tick"></div><div class="dot"></div><div class="nm">组装</div></div>
            <div class="st" id="f5-s4" style="left:57.33cqw"><div class="num">04</div><div class="tick"></div><div class="dot"></div><div class="nm">请求</div></div>
            <div class="st" id="f5-s5" style="left:72cqw"><div class="num">05</div><div class="tick"></div><div class="dot"></div><div class="nm">工具</div></div>
            <div class="st" id="f5-s6" style="left:86.67cqw"><div class="num">06</div><div class="tick"></div><div class="dot"></div><div class="nm">落盘</div></div>

            <div class="panel">
              <div class="k">/ 这一站在做什么</div>
              <div class="beat" id="f5-b1">
                <div class="code"><b>llm/stream</b> → token, token, token</div>
                <div class="path">流回来的只有文本；没有文件，也没有命令</div>
              </div>
              <div class="beat" id="f5-b2">
                <div class="code">tools/<b>pre-execute</b> → execute → <b>post-execute</b></div>
                <div class="path">packages/core/tools/src/pipeline.ts</div>
              </div>
              <div class="beat" id="f5-b3">
                <div class="code">session.append(<b>'assistant/message'</b>)</div>
                <div class="path">模型看见的每一个字，先写日志，再发给模型</div>
              </div>
            </div>

            <div class="log" id="f5-log">
              <div class="k">session.log</div>
              <div class="ln"><span>0001</span>turn/start</div>
              <div class="ln"><span>0002</span>user/message</div>
              <div class="ln"><span>0003</span>assistant/message</div>
              <div class="ln"><span>0004</span>tool/result</div>
              <div class="ln"><span>0005</span>turn/end</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f5");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var tl = gsap.timeline({ paused: true });

          // the first three stations are already spent: this half starts lit
          tl.fromTo(q("#f5-fill2"), { scaleX: 0 }, { scaleX: 1, duration: .9, ease: "power2.out" }, .1);

          function light(n, t) {
            tl.to(q("#f5-s" + n + " .dot"), { backgroundColor: "#4D6BFE", borderColor: "#4D6BFE", duration: .25 }, t);
            tl.to(q("#f5-s" + n + " .nm"), { color: "#EDEAE3", duration: .3 }, t);
            tl.to(q("#f5-s" + n + " .num"), { color: "#4D6BFE", duration: .3 }, t);
          }

          light(4, .15);
          tl.fromTo(q("#f5-b1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .45 }, .5);

          tl.to(q("#f5-b1"), { opacity: 0, duration: .3 }, 3.85);
          light(5, 4.1);
          tl.fromTo(q("#f5-b2"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .45 }, 4.45);

          tl.to(q("#f5-b2"), { opacity: 0, duration: .3 }, 10.35);
          light(6, 10.6);
          tl.fromTo(q("#f5-b3"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .45 }, 10.95);

          // 10.9 — the log itself starts filling
          tl.fromTo(q("#f5-log .k"), { opacity: 0 }, { opacity: 1, duration: .3 }, 10.55);
          var lns = root.querySelectorAll(".ln");
          for (var i = 0; i < lns.length; i++) {
            tl.fromTo(lns[i], { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: .32, ease: "power3.out" }, 10.9 + i * .28);
          }

          // 15.7 — the return arc
          var path = q("#f5-path");
          var len = path.getTotalLength ? path.getTotalLength() : 1200;
          if (path.getTotalLength) {
            gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
          }
          tl.to(path, { strokeDashoffset: 0, duration: 1.7, ease: "power2.inOut" }, 15.75);
          tl.fromTo(q("#f5-arclabel"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .5 }, 16.55);

          tl.fromTo(q("#f5-prog"), { scaleX: 0 }, { scaleX: 1, duration: 19.85, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
