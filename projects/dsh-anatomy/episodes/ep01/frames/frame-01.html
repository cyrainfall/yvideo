<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-01 · 你只说了一句话</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f1 {
          --canvas:#0A0B0D; --line:#232833; --line2:#39404E;
          --text:#EDEAE3; --muted:#A7AEB9; --faint:#787F8B;
          --accent:#4D6BFE; --paper:#E9E4D8;
          position:absolute; inset:0; width:100%; height:100%;
          display:block; overflow:hidden; container-type:size;
          background:transparent;
        }
        #f1 *{box-sizing:border-box;margin:0;padding:0}
        #f1 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f1 .plane{position:absolute;inset:0}

        .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
          color:var(--faint)}
        .chrome .r{color:var(--muted)}
        .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        /* ── the one sentence ─────────────────────────────────────────────── */
        .ask{position:absolute;left:6cqw;top:27.5%;display:flex;align-items:baseline;gap:1.1cqw}
        .caret{font-family:'JB',monospace;font-size:1.5cqw;color:var(--accent);line-height:1}
        .sent{font-family:'Inter',sans-serif;font-weight:650;font-size:3.15cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        .sent .ch{display:inline-block;will-change:opacity}
        .sent .lat{letter-spacing:-.01em}

        /* ── three things it appears to do ────────────────────────────────── */
        .acts{position:absolute;left:6cqw;top:43.5%;width:52cqw}
        
        .act{display:flex;align-items:center;gap:1.2cqw;height:5.0cqw;border-top:1px solid var(--line);
          font-family:'JB',monospace;font-size:1.5cqw;color:var(--muted)}
        .act .tag{width:5.2ch;color:var(--faint);font-size:1.5cqw;letter-spacing:.18em;text-transform:uppercase}
        .act .path{color:var(--muted);letter-spacing:.01em}
        .act .dot{width:.42cqw;height:.42cqw;margin-left:auto;border:1px solid var(--line2);background:transparent}

        /* ── OUTPUT readout ───────────────────────────────────────────────── */
        .out{position:absolute;left:6cqw;top:75%}
        .out .k{font-family:'JB',monospace;font-size:1.45cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        .out .v{margin-top:.9cqw;font-family:'JB',monospace;font-size:2.2cqw;color:var(--text);letter-spacing:.01em;font-variant-numeric:tabular-nums}
        .out .v b{color:var(--accent);font-weight:500}
        .out .bar{margin-top:1.1cqw;width:18cqw;height:1px;background:var(--line);position:relative;overflow:hidden}
        .out .bar i{position:absolute;left:0;top:0;height:1px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}

        /* ── the token column ─────────────────────────────────────────────── */
        .col{position:absolute;right:6cqw;top:14%;width:17cqw;height:72%;overflow:hidden;
          -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);
          mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent)}
        .col .t{font-family:'JB',monospace;font-size:1.3cqw;font-weight:400;letter-spacing:.06em;color:var(--accent);
          height:3.1cqw;display:flex;align-items:center;justify-content:flex-end;
          border-bottom:1px solid rgba(77,107,254,.10);opacity:.85}
        .col .t span{opacity:.55}
        .cap{position:absolute;right:6cqw;top:90%;font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.18em;
          text-transform:uppercase;color:var(--faint);text-align:right}

        .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f1" data-composition-id="frame-01" data-width="1920" data-height="1080" data-duration="12.2">
        <div id="f1-clip" class="clip" data-start="0" data-duration="12.2" data-track-index="0">
          <div class="ground"></div>
          <div class="prog" id="f1-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.01</span><span class="r" id="f1-idx">01 — 08</span></div>
            <div class="rule" id="f1-rule"></div>

            <div class="ask" id="f1-ask">
              <span class="caret" id="f1-caret">&gt;</span>
              <span class="sent" id="f1-sent"><span class="ch">帮</span><span class="ch">我</span><span class="ch">修</span><span class="ch">一</span><span class="ch">下</span><span class="ch">这</span><span class="ch">个</span><span class="ch lat">b</span><span class="ch lat">u</span><span class="ch lat">g</span></span>
            </div>

            <div class="acts" id="f1-acts">
              <div class="act" data-i="0"><span class="tag">read</span><span class="path">packages/core/agent-loop/src/agent.ts</span><span class="dot"></span></div>
              <div class="act" data-i="1"><span class="tag">run</span><span class="path">pnpm test</span><span class="dot"></span></div>
              <div class="act" data-i="2"><span class="tag">edit</span><span class="path">packages/core/tools/src/pipeline.ts</span><span class="dot"></span></div>
            </div>

            <div class="out" id="f1-out">
              <div class="k">output</div>
              <div class="v">token × <b id="f1-count">0</b></div>
              <div class="bar"><i id="f1-bar"></i></div>
            </div>

            <div class="col" id="f1-col" aria-hidden="true" data-layout-ignore></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f1");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var qa = function (s) { return root.querySelectorAll(s); };

          // seed the token column (deterministic markup, then animated)
          var col = q("#f1-col");
          var rows = 9;
          for (var i = 0; i < rows; i++) {
            var d = document.createElement("div");
            d.className = "t";
            d.innerHTML = "<span>token</span>";
            col.appendChild(d);
          }

          var tl = gsap.timeline({ paused: true });

          // 0.00 chrome draws in
          tl.fromTo(q("#f1-rule"), { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, 0);
          

          // 0.15–1.60  「你打下一句话。」 — the sentence types itself
          tl.fromTo(qa(".sent .ch"), { opacity: 0 }, { opacity: 1, duration: .01, stagger: .07 }, 0);
          

          // 1.30–5.23  the three actions it appears to perform
          var acts = qa(".act");
          var at = [1.55, 2.55, 3.55];
          for (var j = 0; j < acts.length; j++) {
            tl.fromTo(acts[j], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .42, ease: "power3.out" }, at[j]);
            tl.fromTo(acts[j].querySelector(".dot"), { backgroundColor: "rgba(77,107,254,0)" },
              { backgroundColor: "#4D6BFE", duration: .2 }, at[j] + .3);
          }

          // 5.45–8.6  everything it "did" dims — it was all just output
          tl.to(acts, { opacity: .34, duration: .7, ease: "power2.inOut" }, 6.05);
          tl.to(q("#f1-ask"), { opacity: .78, duration: .7, ease: "power2.inOut" }, 6.05);

          // 6.6–11.6  the token stream starts falling and the counter runs
          tl.fromTo(qa(".col .t"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: .5, stagger: .055, ease: "power2.out" }, 6.6);
          tl.to(qa(".col .t"), { y: 34, duration: 4.6, ease: "none", stagger: .03 }, 6.9);
          tl.fromTo(q("#f1-out"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .5 }, 6.9);
          tl.to(q("#f1-bar"), { scaleX: 1, duration: 4.2, ease: "power1.inOut" }, 7.0);

          var counter = { n: 0 };
          var out = q("#f1-count");
          tl.to(counter, {
            n: 137, duration: 4.2, ease: "power1.inOut",
            onUpdate: function () { out.textContent = String(Math.round(counter.n)); }
          }, 7.0);


          tl.fromTo(q("#f1-prog"), { scaleX: 0 }, { scaleX: 1, duration: 12.2, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
