<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>frame-08 · 一棵你能改的树</title>
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f8{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#787F8B;--accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size}
        #f8 *{box-sizing:border-box;margin:0;padding:0}
        #f8 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f8 .plane{position:absolute;inset:0}

        .mark{position:absolute;left:6cqw;top:12%;display:flex;align-items:baseline;gap:1.4cqw}
        .mark .s{font-family:'Inter',sans-serif;font-weight:800;font-size:1.9cqw;letter-spacing:-.02em;color:var(--text)}
        .mark .e{font-family:'JB',monospace;font-size:1.45cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

        .l1{position:absolute;left:6cqw;top:36%;font-family:'Inter',sans-serif;font-weight:500;font-size:2.7cqw;
          letter-spacing:-.03em;color:var(--muted)}
        .l2{position:absolute;left:6cqw;top:46.5%;font-family:'Inter',sans-serif;font-weight:800;font-size:5.0cqw;
          letter-spacing:-.05em;color:var(--text);white-space:nowrap}
        .l2 em{font-style:normal;color:var(--accent)}

        .hr{position:absolute;left:6cqw;right:6cqw;top:68%;height:1px;background:var(--line);transform-origin:0 50%}

        .foot{position:absolute;left:6cqw;right:6cqw;top:72%;display:flex;justify-content:space-between;align-items:flex-start}
        .foot .next .k{font-family:'JB',monospace;font-size:1.45cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        .foot .next .v{margin-top:.45cqw;font-family:'Inter',sans-serif;font-weight:600;font-size:1.75cqw;color:var(--text)}
        .foot .next .v b{color:var(--accent);font-weight:700}
        .foot .repo{text-align:right}
        .foot .repo .k{font-family:'JB',monospace;font-size:1.45cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        .foot .repo .v{margin-top:.45cqw;font-family:'JB',monospace;font-size:1.62cqw;color:var(--paper)}

        .tail{position:absolute;left:6cqw;top:88%;font-family:'JB',monospace;font-size:1.45cqw;color:var(--faint);letter-spacing:.04em}

        .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f8" data-composition-id="frame-08" data-width="1920" data-height="1080" data-duration="10">
        <div id="f8-clip" class="clip" data-start="0" data-duration="10" data-track-index="0">
          <div class="ground"></div>
          <div class="prog" id="f8-prog"></div>
          <div class="plane">
            <div class="mark" id="f8-mark"><span class="s">拆开 DSH</span><span class="e">EP.01 — 模型只会说话</span></div>

            <div class="l1" id="f8-l1">不是一个巨大的程序，</div>
            <div class="l2" id="f8-l2">是一棵你能<em>改</em>的树。</div>

            <div class="hr" id="f8-hr"></div>

            <div class="foot" id="f8-foot">
              <div class="next">
                <div class="k">下一集</div>
                <div class="v">EP.02 <b>一切皆插件</b></div>
              </div>
              <div class="repo">
                <div class="k">源码</div>
                <div class="v">github.com/deepseek-ai/deepseek-harness</div>
              </div>
            </div>

            <div class="tail" id="f8-tail">二十行，从最小的插件开始。</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f8");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f8-mark"), { opacity: 0 }, { opacity: 1, duration: .5 }, 0);
          tl.fromTo(q("#f8-l1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .55, ease: "power3.out" }, .15);
          tl.fromTo(q("#f8-l2"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .65, ease: "power3.out" }, 2.65);
          tl.fromTo(q("#f8-hr"), { scaleX: 0 }, { scaleX: 1, duration: .6, ease: "power2.out" }, 5.9);
          tl.fromTo(q("#f8-foot"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .5 }, 6.1);
          tl.fromTo(q("#f8-tail"), { opacity: 0 }, { opacity: 1, duration: .5 }, 7.2);

          tl.fromTo(q("#f8-prog"), { scaleX: 0 }, { scaleX: 1, duration: 10.0, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-08"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
