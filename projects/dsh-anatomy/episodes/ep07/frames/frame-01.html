      <script>
        (function () {
          var root = document.getElementById("f1");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var arr = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          var bars = arr(".lg-c i");
          var seamBars = bars.filter(function (el) { return el.classList.contains("s"); });
          var tl = gsap.timeline({ paused: true });
          var P = "power3.out";
          var fade = function (sel, at, dy) {
            var el = q(sel);
            if (!el) return;
            tl.fromTo(el, { opacity: 0, y: dy || 0 }, { opacity: 1, y: 0, duration: .5, ease: P }, at);
          };

          // 0.00 首帧：铬件、横线、标题一起在，只落下 14px
          tl.fromTo(q("#f1-rule"), { scaleX: 0 }, { scaleX: 1, duration: .55, ease: P }, 0);
          tl.fromTo(q("#f1-h"), { y: 14 }, { y: 0, duration: .55, ease: P }, 0);
          // 0.00 上一季，我们把这台机器拆过一遍。
          fade("#f1-q", .45, 8);

          // 3.30 拆到最后，剩下一件事：它没有内核。
          fade("#f1-k1", 3.30, 6);
          // 7.53 没有内核，一切只能靠插件。
          fade("#f1-k2", 7.53, 6);

          // 10.53 这台机器的配置目录里，条目有两百四十八条。
          fade("#f1-ll", 10.53);
          fade("#f1-lv", 10.60, 10);
          // 12.80 说到「两百四十八条」——账本整体出现
          if (bars.length) {
            tl.fromTo(bars, { opacity: 0, scaleX: .12 },
              { opacity: 1, scaleX: 1, duration: .34, stagger: .0055, ease: P }, 12.80);
          }

          // 15.01 两百四十八条，没有缠成一团意大利面。
          fade("#f1-k3", 15.01);

          // 18.87 答案不在插件里，在插件之间。
          fade("#f1-punch", 18.87, 10);

          // 21.69 生成的能力表里，一百二十一个能力，六十四条是核心。
          fade("#f1-t1", 21.69, 6);
          fade("#f1-cite", 21.88);

          // 26.73 只有三十六条，是可替换的接缝。
          if (seamBars.length) {
            tl.to(seamBars, { backgroundColor: "#E9E4D8", duration: .32, stagger: .018, ease: P }, 26.73);
          }
          // 26.95 「…三十六条…二十个 service…一个 bundle」
          fade("#f1-t2", 26.95);
          // 27.25 是可替换的接缝（图例）
          fade("#f1-lgd", 27.25);

          tl.fromTo(q("#f1-prog"), { scaleX: 0 }, { scaleX: 1, duration: 30.114, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-01"] = tl;
