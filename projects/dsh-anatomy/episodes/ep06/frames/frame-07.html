<!doctype html>
<html lang="zh-CN">
  <head>

  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f7{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#7E8590;
          --accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size;background:transparent}
        #f7 *{box-sizing:border-box;margin:0;padding:0}
        #f7 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f7 .plane{position:absolute;inset:0}

        #f7 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f7 .chrome .r{color:var(--muted)}
        #f7 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f7 .h{position:absolute;left:6cqw;top:8.2cqw;font-family:'Inter',sans-serif;font-weight:800;
          font-size:3.2cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        #f7 .h em{font-style:normal;color:var(--paper)}

        /* 卸载收据 */
        #f7 .rc{position:absolute;left:6cqw;top:13.4cqw;width:38cqw}
        #f7 .rc .cap{font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint)}
        #f7 .rc .cap b{font-weight:400;color:var(--muted)}
        #f7 .rc .rows{margin-top:.7cqw;border-left:1px solid var(--line2);padding-left:1.0cqw}
        #f7 .r{display:flex;font-family:'JB',monospace;font-size:1.55cqw;line-height:2.0;opacity:0}
        #f7 .r .k{width:13.4cqw;color:var(--faint)}
        #f7 .r .v{color:var(--paper)}
        #f7 .r.acc .v{color:var(--accent)}

        /* 回到 EP02 */
        #f7 .back{position:absolute;left:6cqw;top:27.6cqw;width:38cqw;border-left:1px solid var(--line2);padding-left:.9cqw;opacity:0}
        #f7 .back .q{font-family:'Inter',sans-serif;font-size:1.55cqw;color:var(--text);line-height:1.5}
        #f7 .back .s{font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);margin-top:.25cqw}

        /* 前后对比 */
        #f7 .cmp{position:absolute;left:50cqw;top:13.4cqw;width:44cqw;opacity:0}
        #f7 .cmp .hd{display:flex;font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);padding-bottom:.5cqw}
        #f7 .cmp .hd .a{width:18cqw}
        #f7 .cmp .hd .b{width:12cqw;text-align:right}
        #f7 .cmp .hd .c{margin-left:auto;text-align:right;width:6cqw}
        #f7 .cmp .row{display:flex;align-items:baseline;border-top:1px solid var(--line);padding:.62cqw 0;font-family:'JB',monospace;font-size:1.55cqw}
        #f7 .cmp .row .n{width:18cqw;color:var(--muted)}
        #f7 .cmp .row .b{width:12cqw;text-align:right;color:var(--paper)}
        #f7 .cmp .row .c{margin-left:auto;text-align:right;color:var(--faint)}
        #f7 .cmp .row.gone .c{color:var(--muted)}
        #f7 .cmp .n2{font-family:'Inter',sans-serif;font-size:1.5cqw;color:var(--faint);margin-top:.7cqw}

        /* 收束 */
        #f7 .sum{position:absolute;left:6cqw;top:34.4cqw;font-family:'Inter',sans-serif;font-weight:800;
          font-size:3.0cqw;letter-spacing:-.03em;color:var(--text);opacity:0}
        #f7 .sum em{font-style:normal;color:var(--accent)}
        #f7 .fin{position:absolute;left:6cqw;top:39.6cqw;font-family:'Inter',sans-serif;font-size:1.85cqw;color:var(--paper);opacity:0}
        #f7 .fin2{position:absolute;left:6cqw;top:42.4cqw;font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);opacity:0}

        #f7 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f7" data-composition-id="frame-07" data-width="1920" data-height="1080" data-duration="30.239">
        <div id="f7-clip" class="clip" data-start="0" data-duration="29.729" data-track-index="1">
          <div class="ground"></div>
          <div class="prog" id="f7-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.06</span><span class="r">07 — 07</span></div>
            <div class="rule" id="f7-rule"></div>

            <div class="h" id="f7-h">再<em>卸干净</em></div>

            <div class="rc" id="f7-rc">
              <div class="cap">plugin_manager · <b>remove_bundle</b></div>
              <div class="rows">
                <div class="r" id="f7-r1"><span class="k">stage</span><span class="v">"remove"</span></div>
                <div class="r" id="f7-r2"><span class="k">changed</span><span class="v">true</span></div>
                <div class="r acc" id="f7-r3"><span class="k">application</span><span class="v">"applied"</span></div>
              </div>
            </div>

            <div class="back" id="f7-back">
              <div class="q">注册是一个副作用，所以它必须带回一个卸载函数。</div>
              <div class="s">EP.02 一切皆插件</div>
            </div>

            <div class="cmp" id="f7-cmp">
              <div class="hd"><span class="a"></span><span class="b">装上去</span><span class="c">卸下来</span></div>
              <div class="row" id="f7-c1"><span class="n">dock 占位</span><span class="b">7</span><span class="c">6</span></div>
              <div class="row gone" id="f7-c2"><span class="n">工具</span><span class="b">greet</span><span class="c">—</span></div>
              <div class="row gone" id="f7-c3"><span class="n">树节点</span><span class="b">include:greet</span><span class="c">—</span></div>
              <div class="n2">profile 的 package.json / cordis.patch.yml / node_modules 均无残留</div>
            </div>

            <div class="sum" id="f7-sum">五集拆 · <em>一集装</em></div>
            <div class="fin" id="f7-fin">没有内核，所以它可以变成任何形状。</div>
            <div class="fin2" id="f7-fin2">接下来，轮到你了。</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f7");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f7-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);
          tl.fromTo(q("#f7-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.03);

          // 0.00 然后卸掉。 0.95 remove_bundle，也是 applied。
          ["#f7-r1", "#f7-r2", "#f7-r3"].forEach(function (sel, i) {
            tl.fromTo(q(sel), { opacity: 0, x: -5 }, { opacity: 1, x: 0, duration: .3, ease: "power2.out" }, 0.5 + i * .6);
          });

          // 4.12 条目没了，工具没了，那个点也没了。
          tl.fromTo(q("#f7-cmp"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .5 }, 3.7);

          // 7.53 第二集说过，注册是可逆副作用。
          tl.fromTo(q("#f7-back"), { opacity: 0 }, { opacity: 1, duration: .5 }, 7.1);

          // 10.84 到这一集，这句话有了完整的样子…
          ["#f7-c1", "#f7-c2", "#f7-c3"].forEach(function (sel, i) {
            tl.fromTo(q(sel), { opacity: 0, x: -5 }, { opacity: 1, x: 0, duration: .35, ease: "power2.out" }, 10.5 + i * 1.1);
          });

          // 21.54 五集拆，一集装。
          tl.fromTo(q("#f7-sum"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 21.1);

          // 23.77 这台机器没有内核，所以可以变成任何形状。
          tl.fromTo(q("#f7-fin"), { opacity: 0 }, { opacity: 1, duration: .5 }, 23.3);

          // 27.42 接下来，轮到你了。
          tl.fromTo(q("#f7-fin2"), { opacity: 0 }, { opacity: 1, duration: .45 }, 26.9);

          tl.fromTo(q("#f7-prog"), { scaleX: 0 }, { scaleX: 1, duration: 29.729, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-07"] = tl;
        })();
      </script>
    </template>
