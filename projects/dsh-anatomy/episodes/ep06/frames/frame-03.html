      <div id="f3" data-composition-id="frame-03" data-width="1920" data-height="1080" data-duration="33.339">

              <div class="row"><span class="n">agent · child</span><span class="d">挂在某个 agent 名下</span></div>

          </div>

      <script>
        (function () {
          var root = document.getElementById("f3");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f3-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);
          tl.fromTo(q("#f3-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.03);

          // 0.00 工具和命令像，但归宿不同。

          // 2.93 工具跑完是一条 tool/result：进日志，也进模型可见的历史。
          tl.fromTo(q("#f3-a1"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .35 }, 3.0);
          tl.fromTo(q("#f3-a2"), { opacity: 0 }, { opacity: 1, duration: .3 }, 3.9);

          tl.fromTo(q("#f3-dest"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .45 }, 6.1);

          // 8.26 命令跑完是 command/run 和 command/done，成对写进同一本日志。

          tl.fromTo(q("#f3-b2"), { opacity: 0 }, { opacity: 1, duration: .3 }, 10.9);
          tl.fromTo(q("#f3-b3"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .35 }, 11.7);
          tl.fromTo(q("#f3-b4"), { opacity: 0 }, { opacity: 1, duration: .3 }, 12.5);
          tl.fromTo(q("#f3-w2"), { scaleX: 0 }, { scaleX: 1, duration: .35, ease: "power2.out" }, 12.9);
          tl.fromTo(q("#f3-ui"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .45 }, 13.3);

          tl.fromTo(q("#f3-prog"), { scaleX: 0 }, { scaleX: 1, duration: 36.008, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-03"] = tl;
        })();
