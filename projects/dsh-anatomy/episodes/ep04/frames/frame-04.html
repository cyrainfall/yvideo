<!doctype html>
<html lang="zh-CN">
  <head>

  <body>
    <template>
      <style>
        @font-face{font-family:'Inter';src:url('../../assets/fonts/Inter-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}
        @font-face{font-family:'JB';src:url('../../assets/fonts/JetBrainsMono-Variable.woff2') format('woff2');font-weight:100 900;font-display:block}

        #f4{--canvas:#0A0B0D;--line:#232833;--line2:#39404E;--text:#EDEAE3;--muted:#A7AEB9;--faint:#7E8590;
          --accent:#4D6BFE;--paper:#E9E4D8;
          position:absolute;inset:0;width:100%;height:100%;overflow:hidden;container-type:size;background:transparent}
        #f4 *{box-sizing:border-box;margin:0;padding:0}
        #f4 .ground{position:absolute;inset:0;background:var(--canvas)}
        #f4 .plane{position:absolute;inset:0}

        #f4 .chrome{position:absolute;left:6cqw;right:6cqw;top:5.4cqw;display:flex;justify-content:space-between;
          font-family:'JB',monospace;font-size:1.0cqw;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
        #f4 .chrome .r{color:var(--muted)}
        #f4 .rule{position:absolute;left:6cqw;right:6cqw;top:6.5cqw;height:1px;background:var(--line);transform-origin:0 50%}

        #f4 .h{position:absolute;left:6cqw;top:11.5%;font-family:'Inter',sans-serif;font-weight:800;
          font-size:2.9cqw;letter-spacing:-.035em;color:var(--text);white-space:nowrap}
        #f4 .h em{font-style:normal;color:var(--paper)}

        /* ── 左：日志列 ─────────────────────────────────────────── */
        #f4 .loghead{position:absolute;left:6cqw;top:19.4%;display:flex;align-items:center;gap:1.4cqw;font-family:'JB',monospace;
          font-size:1.5cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);opacity:0}
        #f4 .loghead .b{width:6.4cqw}
        #f4 .loghead .m{width:26cqw}
        #f4 .row{position:absolute;left:6cqw;height:4.4cqw;display:flex;align-items:center;gap:1.4cqw;
          border-bottom:1px solid var(--line);opacity:0}
        #f4 .row .b{width:6.4cqw;font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint)}
        #f4 .row .t{width:26cqw;font-family:'JB',monospace;font-size:1.55cqw;color:var(--text)}
        #f4 .row .g{width:15cqw;font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint)}
        #f4 .row.on .g{color:var(--paper)}
        #f4 .row.dead .t{color:var(--faint)}
        #f4 .row.dead .g{color:var(--line2)}

        /* ── 右：只挑几条 ─────────────────────────────────────── */
        #f4 .stats{position:absolute;left:58cqw;top:19.4%;width:36cqw;opacity:0}
        #f4 .stats .pair{display:flex;align-items:flex-end;gap:2.6cqw}
        #f4 .stats .v{font-family:'Inter',sans-serif;font-weight:800;font-size:3.2cqw;letter-spacing:-.04em;
          color:var(--text);line-height:1}
        #f4 .stats .v.hot{color:var(--accent)}
        #f4 .stats .l{margin-top:.6cqw;font-family:'Inter',sans-serif;font-size:1.5cqw;color:var(--muted)}
        #f4 .stats .arrowx{font-family:'JB',monospace;font-size:1.9cqw;color:var(--line2);padding-bottom:.5cqw}
        #f4 .chips{position:absolute;left:58cqw;top:33%;width:36cqw;display:flex;flex-wrap:wrap;gap:.8cqw;opacity:0}
        #f4 .chips .c{border:1px solid var(--line2);padding:.42cqw .8cqw;font-family:'JB',monospace;
          font-size:1.5cqw;color:var(--muted);white-space:nowrap}
        #f4 .rest{position:absolute;left:58cqw;top:53.6%;width:36cqw;font-family:'Inter',sans-serif;
          font-size:1.5cqw;line-height:1.62;color:var(--faint);opacity:0}

        /* ── 底：替换两种 ─────────────────────────────────────── */
        #f4 .repl{position:absolute;left:6cqw;right:6cqw;top:66%;opacity:0}
        #f4 .repl .lab{font-family:'JB',monospace;font-size:1.5cqw;letter-spacing:.14em;text-transform:uppercase;
          color:var(--muted)}
        #f4 .repl .ln{display:flex;align-items:baseline;gap:1.1cqw;margin-top:.9cqw}
        #f4 .repl .idx{font-family:'JB',monospace;font-size:1.5cqw;color:var(--faint);width:2.2cqw;flex:none}
        #f4 .repl .code{font-family:'JB',monospace;font-size:1.5cqw;color:var(--muted);white-space:nowrap}
        #f4 .repl .code b{font-weight:400;color:var(--paper)}
        #f4 .repl .tail{font-family:'Inter',sans-serif;font-size:1.5cqw;color:var(--faint);white-space:nowrap}
        #f4 .repl .hot .code b{color:var(--accent)}

        #f4 .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.42;transform-origin:0 50%;transform:scaleX(0)}
      </style>

      <div id="f4" data-composition-id="frame-04" data-width="1920" data-height="1080" data-duration="23.865">
        <div id="f4-clip" class="clip" data-start="0" data-duration="23.865" data-track-index="1">
          <div class="ground"></div>
          <div class="prog" id="f4-prog"></div>
          <div class="plane">
            <div class="chrome" data-layout-ignore><span>拆开 DSH / EP.04</span><span class="r">04 — 07</span></div>
            <div class="rule" id="f4-rule"></div>

            <div class="h" id="f4-h">日志只追加，历史<em>只挑几条</em></div>

            <div class="loghead" id="f4-loghead"><span class="b">seq</span><span class="m">event</span><span class="b">surfaceOp</span></div>

            <div class="row" id="f4-r1" style="top:24%"><span class="b">618</span><span class="t">turn/start</span><span class="g">—</span></div>
            <div class="row" id="f4-r2" style="top:28.4%"><span class="b">620</span><span class="t">step/start</span><span class="g">—</span></div>
            <div class="row on" id="f4-r3" style="top:32.8%"><span class="b">621</span><span class="t">user/message</span><span class="g">append</span></div>
            <div class="row on" id="f4-r4" style="top:37.2%"><span class="b">623</span><span class="t">assistant/message</span><span class="g">append</span></div>
            <div class="row" id="f4-r5" style="top:41.6%"><span class="b">624</span><span class="t">tool/call</span><span class="g">—</span></div>
            <div class="row on" id="f4-r6" style="top:46%"><span class="b">627</span><span class="t">tool/result</span><span class="g">append</span></div>
            <div class="row" id="f4-r7" style="top:50.4%"><span class="b">628</span><span class="t">step/end</span><span class="g">—</span></div>

            <div class="stats" id="f4-stats">
              <div class="pair">
                <div><div class="v">3307</div><div class="l">条事件</div></div>
                <div class="arrowx" data-layout-ignore>→</div>
                <div><div class="v hot">996</div><div class="l">条进历史</div></div>
              </div>
            </div>
            <div class="chips" id="f4-chips">
              <span class="c">user/message</span><span class="c">assistant/message</span>
              <span class="c">tool/result</span><span class="c">system/message</span><span class="c">developer/message</span>
            </div>
            <div class="rest" id="f4-rest">其余 2311 条是 tool/call、step/start、step/end、job、retry ——<br />它们记录发生了什么，但不进模型看到的历史。</div>

            <div class="repl" id="f4-repl">
              <div class="lab">替换只有两种</div>
              <div class="ln" id="f4-ln1">
                <span class="idx">①</span>
                <span class="code">system/message { op: "replace", startSeq: 198, endSeq: 198 }</span>
                <span class="tail">— 换掉紧挨着的一条</span>
              </div>
              <div class="ln hot" id="f4-ln2">
                <span class="idx">②</span>
                <span class="code">user/message { op: "replace", startSeq: 10, endSeq: 1330 }</span>
                <span class="tail">— 399 条 / 18.6 万 token → 1 条</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var root = document.getElementById("f4");
          if (!root) return;
          var q = function (s) { return root.querySelector(s); };
          var qa = function (s) { return root.querySelectorAll(s); };

          var tl = gsap.timeline({ paused: true });

          tl.fromTo(q("#f4-rule"), { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, 0);
          tl.fromTo(q("#f4-h"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 0.05);

          // 0.00–4.38 「每一步都写进同一本日志，只追加，不改写。」
          tl.fromTo(q("#f4-loghead"), { opacity: 0 }, { opacity: 1, duration: .35 }, 0.3);
          tl.fromTo(qa(".row"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: .35, stagger: .18, ease: "power2.out" }, 0.55);

          // 4.60–9.24 「写的时候要带一个标记：是新加一条，还是替换一段。」
          tl.fromTo(q("#f4-stats"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .45, ease: "power2.out" }, 4.7);
          tl.fromTo(qa(".row.on .g"), { opacity: 0 }, { opacity: 1, duration: .3, stagger: .12 }, 5.4);

          // 9.46–15.27 「没有标记的，是流式碎片、是边界，它们进不了模型看到的历史。」
          tl.to(qa(".row:not(.on)"), { opacity: .38, duration: .5, stagger: .06 }, 9.6);
          tl.to(qa(".row:not(.on) .t"), { color: "#7E8590", duration: .5 }, 9.6);
          tl.fromTo(q("#f4-chips"), { opacity: 0 }, { opacity: 1, duration: .45 }, 10.2);
          tl.fromTo(q("#f4-rest"), { opacity: 0 }, { opacity: 1, duration: .5 }, 11.4);

          // 15.49–23.36 「替换有两种：只换掉紧贴着的一条，或者上下文太长……」
          tl.fromTo(q("#f4-repl"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 15.6);
          tl.fromTo(q("#f4-ln1"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .4 }, 16.4);
          tl.fromTo(q("#f4-ln2"), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: .4 }, 18.4);

          tl.fromTo(q("#f4-prog"), { scaleX: 0 }, { scaleX: 1, duration: 23.865, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["frame-04"] = tl;
        })();
      </script>
    </template>
  </body>
